[package]
name = "pre-midi-desktop"
version = "0.14.1-preview.28"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
cc = "1"

[dependencies]
premidi-decoder = { path = "../native/decoder" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "=2.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "=0.10.9"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[[bin]]
name = "pre-midi"
path = "src/main.rs"
