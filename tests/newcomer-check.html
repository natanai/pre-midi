<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{width:100%;height:100vh;border:0}</style>
<iframe src="about:blank" title="Newcomer sound workflow"></iframe><pre id="result" hidden></pre>
<script type="module">
import {parse} from "../schema.js";
const frame=document.querySelector("iframe"),checks={};
const wait=async(check,label)=>{for(let i=0;i<160;i++){if(check())return;await new Promise(done=>setTimeout(done,25));}throw Error("Timed out: "+label);};
const assert=(label,ok)=>{checks[label]=!!ok;if(!ok)throw Error(label);};
frame.addEventListener("load",async()=>{
 let doc=frame.contentDocument,win=frame.contentWindow,blob,heard=0;
 const get=id=>doc.getElementById(id),knob=name=>doc.querySelector('[role="slider"][aria-label="'+name+'"]');
 const capture=()=>{
  const create=win.URL.createObjectURL.bind(win.URL);win.URL.createObjectURL=value=>{if(value.type==="application/json")blob=value;return create(value);};
  win.HTMLAnchorElement.prototype.click=function(){};
  const make=win.AudioContext.prototype.createOscillator;
  win.AudioContext.prototype.createOscillator=function(){const source=make.call(this),start=source.start.bind(source);source.start=(...args)=>{heard++;return start(...args);};return source;};
 };
 const score=async()=>{blob=null;get("export").click();get("export-confirm").click();assert("editable native export",!!blob);return parse(await blob.text());};
 let status="FAIL";
 try{
  win.confirm=()=>true;get("new").click();capture();
  get("add-instrument").click();
  const card=doc.querySelector('.preset-card[data-preset-id="felt-electric"]');
  card.querySelector(".preset-preview").click();await wait(()=>heard>0,"audible preset preview");
  card.querySelector(".preset-choose").click();await wait(()=>!get("instrument-dialog").open,"choose sound");
  if(get("sound-toggle").getAttribute("aria-expanded")!=="true")get("sound-toggle").click();
  const primary=doc.querySelector("#synth-editor .synth-group");
  assert("common sound controls appear first",primary.open&&primary.querySelector("summary").textContent==="Sound"&&
   ["Cutoff","Attack","Release"].every(name=>primary.contains(knob(name))));
  assert("one control per parameter",["Cutoff","Attack","Release"].every(name=>doc.querySelectorAll('[role="slider"][aria-label="'+name+'"]').length===1));
  const before=(await score()).instruments.at(-1),beforeHeard=heard;
  get("hear-sound").click();await wait(()=>heard>beforeHeard,"hear current sound");
  for(const [name,key,count] of [["Cutoff","ArrowUp",8],["Attack","ArrowUp",5],["Release","ArrowUp",5],["Volume","ArrowDown",10]])
   for(let i=0;i<count;i++)knob(name).dispatchEvent(new win.KeyboardEvent("keydown",{key,bubbles:true}));
  const after=(await score()).instruments.at(-1);
  assert("brightness and timing edit the actual patch",after.sounds[0].patch.filter.cutoff>before.sounds[0].patch.filter.cutoff&&
   after.sounds[0].patch.envelope.attack>before.sounds[0].patch.envelope.attack&&after.sounds[0].patch.envelope.release>before.sounds[0].patch.envelope.release);
  assert("volume makes the instrument softer",after.volume<before.volume);
  win.prompt=()=>"Newcomer variation";get("save-sound").click();
  await wait(()=>(win.localStorage.getItem("premidi-user-sounds-v2")||"").includes("Newcomer variation"),"save variation");
  const reload=new Promise(done=>frame.addEventListener("load",done,{once:true}));win.location.reload();await reload;
  doc=frame.contentDocument;win=frame.contentWindow;capture();
  get("add-instrument").click();
  const saved=[...doc.querySelectorAll(".preset-card")].find(card=>card.querySelector("strong").textContent==="Newcomer variation");
  assert("saved variation available after reload",!!saved);
  saved.querySelector(".preset-choose").click();await wait(()=>!get("instrument-dialog").open,"restore saved variation");
  const restored=(await score()).instruments.at(-1);
  const {presetId:oldId,...oldTone}=after.sounds[0].patch,{presetId:newId,...newTone}=restored.sounds[0].patch;
  assert("variation preserves softness and patch",restored.volume===after.volume&&JSON.stringify(newTone)===JSON.stringify(oldTone)&&newId===saved.dataset.presetId);
  knob("Volume").dispatchEvent(new win.KeyboardEvent("keydown",{key:"ArrowUp",bubbles:true}));
  get("change-sound").click();
  const replacement=[...doc.querySelectorAll(".preset-card")].find(card=>card.querySelector("strong").textContent==="Newcomer variation");
  replacement.querySelector(".preset-choose").click();await wait(()=>!get("instrument-dialog").open,"replace with saved variation");
  assert("browse also restores saved softness",(await score()).instruments.at(-1).volume===after.volume);
  assert("no extra horizontal clipping",doc.documentElement.scrollWidth<=frame.clientWidth+3);
  status="PASS";
 }catch(error){checks.error=String(error.stack||error);}
 document.getElementById("result").textContent=JSON.stringify(checks);
 await fetch("/__newcomer_result?status="+status+"&details="+encodeURIComponent(JSON.stringify(checks)));
},{once:true});frame.src="../index.html";
</script>
