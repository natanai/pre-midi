<!doctype html><html lang="en" data-example-presets="PENDING">
<head><meta charset="utf-8"><title>Example-derived sound catalog integration</title></head>
<body><pre id="results"></pre><iframe src="../index.html" style="width:100%;height:700px;border:0"></iframe>
<script type="module">
const frame=document.querySelector("iframe"),result=document.getElementById("results");
const checks={};
const wait=async(predicate,label)=>{
 for(let i=0;i<300;i++){
  if(predicate())return;
  await new Promise(resolve=>setTimeout(resolve,25));
 }
 throw Error("Timed out: "+label);
};
frame.addEventListener("load",async()=>{
 const doc=frame.contentDocument,win=frame.contentWindow;
 const get=id=>doc.getElementById(id),library=get("instrument-dialog");
 const category=name=>{
  const b=[...library.querySelectorAll(".library-filter")].find(b=>b.textContent===name);
  if(!b)throw Error("Missing "+name+" category");
  b.click();
 };
 const card=id=>library.querySelector('.preset-card[data-preset-id="'+id+'"]');
 try{
  win.confirm=()=>true;
  get("new").click();get("add-instrument").click();
  await wait(()=>library.open,"Open sound picker");
  checks.noExamplesCategory=![...library.querySelectorAll(".library-filter")].some(b=>b.textContent==="Examples");
  category("Drums");
  checks.rackAndHitInDrums=!!card("example-neon-after-hours-0") &&
   !!card("example-neon-after-hours-0-pulse") &&
   card("example-neon-after-hours-0")?.querySelector("strong")?.textContent==="Drum rack · nine sounds";
  checks.pitchedNotInDrums=!card("example-neon-after-hours-1");
  const rack=card("example-neon-after-hours-0");
  rack?.querySelector(".preset-choose")?.click();
  await wait(()=>!library.open&&doc.querySelectorAll(".instrument-card").length===2,"Add example rack");
  checks.rackEditable=doc.querySelectorAll("#piano .rack-row").length===9 &&
   get("instrument-name").value==="Drum rack · nine sounds";

  get("add-instrument").click();category("Bass");
  const bass=card("example-neon-after-hours-1");
  checks.bassInBass=!!bass&&bass.querySelector("strong")?.textContent==="Sustained sub-bass";
  bass?.querySelector(".preset-choose")?.click();
  await wait(()=>!library.open&&doc.querySelectorAll(".instrument-card").length===3,"Add example bass");
  checks.pitchedEditable=get("instrument-name").value==="Sustained sub-bass"&&
   !!doc.querySelector("#piano .note-name");

  get("add-instrument").click();category("Drums");
  const solo=card("example-neon-after-hours-0-pulse");
  solo?.querySelector(".preset-choose")?.click();
  await wait(()=>!library.open&&doc.querySelectorAll(".instrument-card").length===4,"Add example hit");
  checks.rowEditable=get("instrument-name").value==="Synth kick"&&
   doc.querySelectorAll("#piano .rack-row").length===1;
  document.documentElement.dataset.examplePresets=Object.values(checks).every(Boolean)?"PASS":"FAIL";
  result.textContent=JSON.stringify(checks);
 }catch(error){
  document.documentElement.dataset.examplePresets="FAIL";
  result.textContent=String(error?.stack||error)+" "+JSON.stringify(checks)+" "+get("status").textContent;
 }
 void fetch("/__example_presets_result?status="+document.documentElement.dataset.examplePresets+
 "&details="+encodeURIComponent(result.textContent)).catch(()=>{});
},{once:true});
</script></body></html>
