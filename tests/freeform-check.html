<!doctype html>
<meta charset="utf-8">
<title>Attached freeform interaction check</title>
<iframe id="studio" title="Studio" style="width:100vw;height:100vh;border:0"></iframe>
<script>
(async()=>{
 const frame=document.getElementById("studio"),issues=[];
 const assert=(yes,label)=>{if(!yes)throw Error(label);};
 const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const wait=async(fn,label,max=8000)=>{const end=Date.now()+max;
  while(Date.now()<end){if(fn())return;await pause(35);}
  throw Error("Timed out: "+label);
 };
 const report=(status,details)=>fetch("/__song_result?status="+status+"&details="+encodeURIComponent(details)).catch(()=>{});
 try{
  frame.src="/index.html";
  await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=()=>reject(Error("Studio did not load"));});
  const win=frame.contentWindow,doc=frame.contentDocument,get=id=>doc.getElementById(id);
  win.addEventListener("error",e=>issues.push(String(e.message||e.error)));
  win.addEventListener("unhandledrejection",e=>issues.push(String(e.reason)));
  await wait(()=>doc.querySelectorAll(".instrument-card").length>0,"Beat initialized");
  get("bars").value="2";get("bars").dispatchEvent(new Event("change",{bubbles:true}));
  const note=doc.querySelector('#piano .note[aria-label^="C4, step 1,"]');
  assert(note,"A standard Beat note is editable");
  note.click();
  assert(doc.querySelectorAll("#piano .note.filled").length>0,"Beat note exists");
  get("song-expand").click();
  await wait(()=>doc.querySelectorAll(".song-beat-clip").length===1,"Song created");
  assert(doc.querySelectorAll(".song-freeform-row").length===1,"One attached lane per Beat Track");
  assert(doc.querySelector(".song-freeform-row").classList.contains("dormant"),
   "Unused attached freeform begins as a compact drop tab");
  doc.querySelector(".song-freeform-toggle").click();
  await wait(()=>!doc.querySelector(".song-freeform-editor").hidden,"Empty freeform editor opens");
  assert(doc.querySelector("main").classList.contains("editing-freeform"),"Freeform owns lower editor space");
  assert(doc.querySelectorAll(".freeform-instrument-list .instrument-card").length===1,
   "Attached freeform inherits its Beat Instrument without asking to add one");
  assert(![...doc.querySelectorAll(".freeform-editor-tools button")]
   .some(button=>button.textContent==="+ instrument"),
   "Attached freeform cannot create a divergent Instrument");
  await wait(()=>doc.querySelector(".freeform-roll-content"),"Linked piano roll available");
  // Freeform must occupy the same lower workspace as Beat, not a scroller
  // inside the height-capped Song arranger.
  const freeform=doc.querySelector(".song-freeform-editor");
  assert(freeform.parentElement===doc.querySelector("main"),
   "Freeform mounts directly in main beside the Beat editor");
  assert(!get("song-panel").contains(freeform),"Song arranger never encloses freeform");
  assert(!!freeform.querySelector(".freeform-instrument-pane")&&
   !!freeform.querySelector(".freeform-note-work")&&
   !!freeform.querySelector(".freeform-sound-pane"),
   "Freeform has Beat-style instrument, note and Sound workspaces");
  const pianoToggle=freeform.querySelector(".freeform-piano-tools .piano-keys-toggle");
  assert(pianoToggle?.getAttribute("aria-pressed")==="true"&&
   !!freeform.querySelector(".freeform-roll-content .piano-keys-overlay"),
   "Freeform uses the shared Beat piano keyboard overlay");
  pianoToggle.click();
  assert(!freeform.querySelector(".freeform-roll-content .piano-keys-overlay"),
   "Shared keyboard toggle switches to note labels");
  pianoToggle.click();
  assert(!!freeform.querySelector(".freeform-roll-content .piano-keys-overlay"),
   "Shared keyboard toggle restores piano keys");
  const qwerty=freeform.querySelector(".freeform-piano-tools [aria-label='play with QWERTY keyboard']");
  assert(qwerty,"Freeform offers the Beat QWERTY performance controller");
  qwerty.click();
  assert(qwerty.getAttribute("aria-pressed")==="true","Freeform QWERTY keyboard activates");
  doc.dispatchEvent(new KeyboardEvent("keydown",{code:"Escape",key:"Escape",bubbles:true,cancelable:true}));
  assert(qwerty.getAttribute("aria-pressed")==="false","Escape exits freeform QWERTY mode");
  const scale=freeform.querySelector(".freeform-scale-controls");
  const [scaleRoot,scaleMode]=scale.querySelectorAll("select");
  const scaleLock=scale.querySelector('input[type="checkbox"]');
  assert(scaleRoot&&scaleMode&&scaleLock,"Freeform has identical key, scale and lock controls");
  scaleRoot.value="0";
  scaleMode.value="major";
  scaleMode.dispatchEvent(new Event("change",{bubbles:true}));
  scaleLock.checked=true;
  scaleLock.dispatchEvent(new Event("change",{bubbles:true}));
  const blocked=[...doc.querySelectorAll(".freeform-note-row")]
   .find(r=>(r.getAttribute("aria-label")||"").includes("pitch 61 "));
  blocked.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true}));
  assert(doc.querySelectorAll(".freeform-roll-note").length===0,
   "Scale lock prevents adding out-of-scale Song notes");
  const row=[...doc.querySelectorAll(".freeform-note-row")].find(r=>(r.getAttribute("aria-label")||"").includes("pitch 60 "));
  assert(row,"C4 has an editable Song row");
  row.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true,cancelable:true}));
  await wait(()=>doc.querySelectorAll(".freeform-roll-note").length===1,"Direct freeform note created");
  const soundSummary=doc.querySelector(".freeform-sound-summary");
  assert(soundSummary,"Freeform Sound editor shares the existing workspace");
  soundSummary.click();
  await wait(()=>!!doc.querySelector(".freeform-sound-modules .synth-grid"),"Canonical synth editor visible");
  assert(doc.querySelector(".freeform-sound-scope .signal-scope"),"Measured sound waveform is present");
  const {loadDraft}=await import("/storage.js");
  const readDraft=async()=>{
   const raw=await loadDraft();
   return raw?JSON.parse(raw):null;
  };
  const waitForDraft=async(predicate,label)=>{
   const deadline=Date.now()+12000;
   while(Date.now()<deadline){
    const saved=await readDraft();
    if(predicate(saved))return saved;
    await pause(50);
   }
   throw Error("Timed out: "+label);
  };
  const firstId=(await waitForDraft(saved=>
   saved?.tracks?.[0]?.freeform?.instruments?.[0]?.notes?.length===1,
   "Draft saves the independent freeform note")).tracks[0].freeform.instruments[0].notes[0].id;
  const browse=doc.querySelector(".freeform-sound-browse");
  assert(browse,"Freeform opens the existing Sound catalog");
  browse.click();
  await wait(()=>get("instrument-dialog").open,"Shared Sound library opens");
  const preset=doc.querySelector('.preset-card[data-preset-id="init"]');
  assert(preset,"Factory synth presets remain accessible from freeform");
  preset.querySelector(".preset-choose").click();
  await wait(()=>!get("instrument-dialog").open,"Preset selection closes shared library");
  const selected=(await waitForDraft(saved=>
   saved?.tracks?.[0]?.freeform?.instruments?.[0]?.sounds?.[0]?.patch?.presetId==="init",
   "Freeform preset selection persists to Song")).tracks[0].freeform.instruments[0];
  assert(selected.notes.length===1&&selected.notes[0].id===firstId,
   "Choosing a linked Sound retains its independent Song-position notes");
  assert((await readDraft()).beats[0].instruments[0].sounds[0].patch.presetId==="init",
   "Changing a linked freeform Sound changes its source Beat Instrument");
  assert(selected.sounds[0].patch.presetId==="init",
   "Factory preset writes the canonical patch in freeform Song data");
  await wait(()=>!!doc.querySelector(".freeform-sound-modules .synth-grid"),
   "Shared synth editor stays available after preset selection");
  const distortion=doc.querySelector('.freeform-sound-modules [data-sound-path="effects.drive"] [role="slider"]');
  assert(distortion,"Canonical distortion knob is available on freeform Sound");
  distortion.dispatchEvent(new KeyboardEvent("keydown",{
   key:"PageUp",bubbles:true,cancelable:true
  }));
  await wait(()=>Number(doc.querySelector(
   '.freeform-sound-modules [data-sound-path="effects.drive"] [role="slider"]'
  )?.getAttribute("aria-valuenow"))>.05,"Sound effects persist after adjustment");
  const save=doc.querySelector(".freeform-sound-save");
  assert(save,"Freeform uses the existing Save preset dialog");
  save.click();
  await wait(()=>get("save-preset-dialog").open,"Shared preset dialog opens");
  get("save-preset-name").value="Freeform preset test";
  get("save-preset-form").dispatchEvent(new Event("submit",{
   bubbles:true,cancelable:true
  }));
  await wait(()=>!get("save-preset-dialog").open,"Freeform preset saves locally");
  assert(JSON.parse(win.localStorage.getItem("premidi-user-sounds-v2")||"[]")
   .some(preset=>preset.name==="Freeform preset test"),
   "Freeform preset appears in the one user Sound library");
  const soundPreview=doc.querySelector(".freeform-sound-play");
  assert(soundPreview?.textContent==="▶","Freeform Sound has a native-aware preview");
  soundPreview.click();
  const controls=doc.querySelector(".freeform-editor-tools");
  const songBar=controls.querySelector('input[aria-label="Song scrubber bar"]');
  assert(songBar,"Freeform navigation uses the Song scrubber rather than another timeline");
  songBar.value="5";songBar.dispatchEvent(new Event("change",{bubbles:true}));
  assert(get("song-ruler").getAttribute("aria-valuenow")==="5",
   "Freeform navigation moves the canonical Song scrubber");
  assert(doc.querySelector(".freeform-roll-ruler").textContent.includes("5"),
   "Freeform viewport follows the Song scrubber");
  songBar.value="1";songBar.dispatchEvent(new Event("change",{bubbles:true}));
  assert(get("song-ruler").getAttribute("aria-valuenow")==="1",
   "Returning the Song scrubber restores freeform bar one");
  const noteMode=doc.querySelector(".freeform-note-mode");
  assert(noteMode&&noteMode.getAttribute("aria-pressed")==="false",
   "Freeform defaults to Beat-style click-to-remove mode");
  noteMode.click();
  assert(doc.querySelector(".freeform-note-mode").getAttribute("aria-pressed")==="true",
   "Freeform note effects mode is an explicit toolbar toggle");
  doc.querySelector(".freeform-roll-note").click();
  const lengthField=[...doc.querySelectorAll(".freeform-note-details .freeform-field")]
   .find(item=>item.textContent.includes("length"));
  assert(lengthField,"Selected note has an editable length");
  lengthField.querySelector("input").value="16";
  lengthField.querySelector("input").dispatchEvent(new Event("change",{bubbles:true}));
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="stop song","Freeform Song starts");
  await wait(()=>doc.querySelector(".freeform-key.sounding")&&
   !doc.querySelector(".freeform-playhead").hidden,"Held note lights its piano key and scan line");
  get("play").click();
  assert(doc.querySelectorAll(".song-freeform-preview-note").length===1,"Song lane shows direct note");
  const original=doc.querySelector(".song-beat-clip");
  original.click();
  await wait(()=>!doc.querySelector(".song-unpack-action").hidden,"Accessible unpack action");
  doc.querySelector(".song-unpack-action").click();
  await wait(()=>doc.querySelectorAll(".song-beat-clip").length===0,"Beat Clip replaced by freeform");
  assert(doc.querySelectorAll(".song-freeform-passage").length===1,"Converted passage remains attached");
  assert(doc.querySelectorAll(".song-freeform-preview-note").length>=2,"Original and direct note are independent");
  const instrumentCards=[...doc.querySelectorAll(".freeform-instrument-list .instrument-card")];
  assert(instrumentCards.length===1,
   "Unpacking a Beat reuses its attached Instrument rather than cloning it");
  assert(instrumentCards[0].getAttribute("aria-pressed")==="true",
   "Source Instrument remains selected after unpacking");
  await wait(()=>doc.querySelectorAll(".freeform-roll-note").length>0,"Unpacked source notes editable");
  const madeCount=doc.querySelectorAll(".song-beat-clip").length;
  const create=doc.querySelector(".freeform-create-beat");
  assert(create&&doc.querySelector('.freeform-selection-tools input[aria-label="Selection length in bars"]'),
   "Song selection has an explicit reusable Beat creation control");
  create.click();
  await wait(()=>get("title").value==="Beat 1 selection","New reusable Beat opens in the shared Beat editor");
  assert(doc.querySelector(".song-freeform-editor").hidden,
   "Beat editor replaces freeform editor after successful creation");
  assert(doc.querySelectorAll(".song-beat-clip").length===madeCount,
   "New Beat does not double Song playback by placing itself");
  assert(doc.querySelectorAll(".song-freeform-preview-note").length>=2,
   "Creating a Beat preserves the original freeform music");
  get("undo").click();
  await wait(()=>get("title").value==="Untitled beat","Creating Beat is undoable");
  get("redo").click();
  await wait(()=>get("title").value==="Untitled beat","Undo/redo maintains a valid Beat selection");
  let project;
  win.URL.createObjectURL=(original=>blob=>{project=blob;return original.call(win.URL,blob);})(win.URL.createObjectURL);
  win.HTMLAnchorElement.prototype.click=function(){};
  get("export").click();
  assert(get("export-dialog").open,"Song export available");
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>!!project,"Song export completed");
  await wait(()=>!get("export-dialog").open,"Song export dialog has closed");
  const saved=JSON.parse(await project.text());
  assert(saved.kind==="song"&&saved.version===22,"Freeform exported as Song v22");
  assert(saved.tracks[0].freeform.instruments.length===1,"Song retains one linked Instrument identity");
  assert(saved.tracks[0].freeform.instruments[0].sounds[0].patch.effects.drive>.05,
   "Freeform Sound changes export in canonical synth patch fields");
  assert(saved.tracks[0].freeform.passages.length===1,"Song retains converted passage");
  assert(saved.beats.length===2,"New Beat saved as an independent reusable Song Beat");
  assert(saved.tracks[0].clips.length===0,"New Beat stays unplaced until explicitly requested");
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="stop song","Unpacked Song plays",9000);
  get("play").click();
  // Replace a freeform synth with a real companion WAV and verify the same
  // sampler editor, package format and Song audio transport still work.
  doc.querySelector(".song-freeform-toggle").click();
  await wait(()=>!doc.querySelector(".song-freeform-editor").hidden,
   "Freeform opens again for sample editing");
  const soundToggle=doc.querySelector(".freeform-sound-summary");
  if(soundToggle.getAttribute("aria-expanded")!=="true")soundToggle.click();
  await wait(()=>!!doc.querySelector(".freeform-sound-host input[type=file]"),
   "Freeform sampler import is available");
  const frames=2205,bytes=new Uint8Array(44+frames*2),view=new DataView(bytes.buffer);
  const str=(offset,value)=>{for(let i=0;i<value.length;i++)bytes[offset+i]=value.charCodeAt(i);};
  str(0,"RIFF");view.setUint32(4,bytes.length-8,true);str(8,"WAVE");
  str(12,"fmt ");view.setUint32(16,16,true);view.setUint16(20,1,true);
  view.setUint16(22,1,true);view.setUint32(24,44100,true);
  view.setUint32(28,88200,true);view.setUint16(32,2,true);
  view.setUint16(34,16,true);str(36,"data");view.setUint32(40,frames*2,true);
  for(let n=0;n<frames;n++)view.setInt16(44+n*2,Math.round(Math.sin(n*.1)*11000),true);
  const soundFile=new win.File([bytes],"freeform-test.wav",{type:"audio/wav"});
  const transfer=new win.DataTransfer();transfer.items.add(soundFile);
  const fileControl=doc.querySelector(".freeform-sound-host input[type=file]");
  fileControl.files=transfer.files;fileControl.dispatchEvent(new Event("change",{bubbles:true}));
  await wait(()=>!!doc.querySelector(".freeform-sound-modules .sample-zones"),
   "Canonical sampler editor opens after importing audio");
  const filter=doc.querySelector('.freeform-sound-modules [aria-label="Recorded sound filter type"]');
  assert(filter,"Freeform sample has existing filter and distortion settings");
  filter.value="highpass";filter.dispatchEvent(new Event("change",{bubbles:true}));
  await wait(()=>doc.querySelector(
   '.freeform-sound-modules [aria-label="Recorded sound filter type"]'
  )?.value==="highpass","Sample tone change is saved");
  project=null;
  get("export").click();get("export-form").dispatchEvent(
   new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>!!project&&project.size>44,"Freeform sample exports as portable Song");
  const {readZip}=await import("/zip.js"),entries=await readZip(project);
  const manifestEntry=[...entries].find(([key])=>key.endsWith(".premidi"));
  assert(manifestEntry,"ZIP includes canonical Song .premidi manifest");
  const packaged=JSON.parse(new TextDecoder().decode(manifestEntry[1]));
  const edited=packaged.tracks[0].freeform.instruments[0].sounds[0].patch;
  assert(edited.type==="sample"&&edited.filter.type==="highpass",
   "Imported sample and Sound filter survive Song export");
  assert(entries.has(packaged.tracks[0].freeform.samples[0].path),
   "Imported audio remains external, alongside the .premidi manifest");
  await wait(()=>!get("export-dialog").open,"Portable Song export closes");
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="stop song",
   "Imported freeform audio plays as part of Song",9000);
  get("play").click();
  assert(!issues.length,"No runtime browser errors: "+issues.join("; "));
  await report("PASS","Freeform empty editing, notes, unpack, versioned export and playback");
 }catch(error){
  const info={play:frame.contentDocument?.getElementById("play")?.getAttribute("aria-label"),status:frame.contentDocument?.getElementById("status")?.textContent,songHidden:frame.contentDocument?.getElementById("song-panel")?.hidden,clipCount:frame.contentDocument?.querySelectorAll(".song-beat-clip").length,freeformNotes:frame.contentDocument?.querySelectorAll(".freeform-roll-note").length};
  let debug={};
  try{
   const stored=JSON.parse(frame.contentWindow.localStorage.getItem("premidi-v5-draft")||"null");
   const free=stored?.tracks?.[0]?.freeform;
   debug={storedType:free?.instruments?.[0]?.sounds?.[0]?.patch?.type,
    assetCount:free?.samples?.length,
    detailsOpen:frame.contentDocument?.querySelector(".freeform-sound-details")?.open,
    moduleChildren:frame.contentDocument?.querySelector(".freeform-sound-modules")?.children?.length,
    moduleStart:frame.contentDocument?.querySelector(".freeform-sound-modules")?.innerHTML?.slice(0,200),
    sampleUploadNode:!!frame.contentDocument?.querySelector(".freeform-sound-host input[type=file]"),
    msg:frame.contentDocument?.querySelector("#notice,#message,#status")?.textContent};
  }catch{}
  await report("FAIL",String(error.stack||error)+" "+JSON.stringify(info)+" "+JSON.stringify(debug)+" "+issues.join("; "));
 }
})();
</script>
