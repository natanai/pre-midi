<!doctype html>
<html lang="en" data-layout="PENDING">
<head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style>
<script>
async function checkLayout(frame){
 try{
 const doc=frame.contentDocument;
 const browserErrors=[];const diagnostics={};
 frame.contentWindow.addEventListener("error",event=>browserErrors.push(String(event.message||event.error)));
 frame.contentWindow.addEventListener("unhandledrejection",event=>browserErrors.push(String(event.reason)));
 const get=id=>doc.getElementById(id);
 const rect=el=>el.getBoundingClientRect();
 const pane=doc.querySelector(".instrument-pane");
 const heading=pane.querySelector(".heading");
 const button=get("add-instrument");
 const toolbar=doc.querySelector(".notes-toolbar");
 const notesHead=doc.querySelector(".notes-heading");
 const controls=[...toolbar.querySelectorAll("button, select, input")];
 const sidebar=rect(pane), add=rect(button), title=rect(heading);
 const tools=rect(toolbar), noteHead=rect(notesHead);
 const checks={
  instrumentButtonInPane:add.left>=sidebar.left && add.right<=sidebar.right-7,
  instrumentButtonBelowTitle:add.top>=title.bottom-1,
  instrumentButtonNotTruncated:button.scrollWidth<=button.clientWidth+2,
  notesToolbarBelowHeading:tools.top>=noteHead.bottom-1,
  notesControlsFit:controls.every(el=>{const b=rect(el);return b.left>=tools.left-2&&b.right<=tools.right+2;}),
  noPageHorizontalClipping:doc.documentElement.scrollWidth<=frame.clientWidth+3
 };
 // Inspector is the same real Sound editor in a different responsive position.
 const sound=get("sound-section"),toggle=get("sound-toggle"),roll=doc.querySelector(".piano-scroll");
 const notesBefore=rect(doc.querySelector(".notes-section"));
 roll.scrollTop=140;
 const scrolled=roll.scrollTop;
 checks.composerVisible=notesBefore.width>180&&rect(doc.querySelector(".timeline-section")).width>180;
 checks.soundInspectorAvailable=!!sound.querySelector("#synth-editor")&&!!sound.querySelector("#sound-visualizer");
 if(frame.clientWidth>=1100) {
  checks.soundInitiallyBesideComposer=getComputedStyle(sound).position==="sticky" && toggle.getAttribute("aria-expanded")==="true";
  toggle.click();
  checks.soundCanCollapse=toggle.getAttribute("aria-expanded")==="false" && getComputedStyle(sound).display==="none";
  toggle.click();
  checks.soundCanReopen=toggle.getAttribute("aria-expanded")==="true" && getComputedStyle(sound).display!=="none";
 }else{
  checks.mobileInitiallyClosed=toggle.getAttribute("aria-expanded")==="false";
  toggle.click();
  checks.mobileExpandedOpens=getComputedStyle(sound).position==="fixed" &&
   doc.querySelector(".work").classList.contains("inspector-expanded");
  checks.mobileDialsVisible=getComputedStyle(get("synth-editor")).display!=="none";
  get("sound-close").click();
  checks.mobileCloses=doc.querySelector(".work").classList.contains("inspector-closed");
 }
 checks.inspectorPreservesPianoPosition=roll.scrollTop===scrolled;
 // Normal mode is the direct note sequencer: empty by default; click adds,
 // and a second click removes. No mode switch is needed to compose.
 const firstNote=()=>[...doc.querySelectorAll("#piano .note")].find(el=>
  el.getAttribute("aria-label")?.includes("C4, step 1"));
 checks.newCompositionBlank=doc.querySelectorAll("#piano .note.filled").length===0;
 firstNote()?.click();
 checks.noteAddedByClick=doc.querySelectorAll("#piano .note.filled").length>0;
 firstNote()?.click();
 checks.noteRemovedByClick=doc.querySelectorAll("#piano .note.filled").length===0;
 get("note-mode").click();
 checks.noteModeVisible=get("note-mode").getAttribute("aria-pressed")==="true" &&
  doc.querySelector(".work").classList.contains("editing-note-effects");
 firstNote()?.click();
 checks.noteExpressionOpens=!!doc.querySelector("#note-expression:not([hidden]) select[aria-label='Held note bend shape']");
 const shape=doc.querySelector("#note-expression select[aria-label='Held note bend shape']");
 if(shape){
  shape.value="wail";
  shape.dispatchEvent(new Event("change",{bubbles:true}));
 }
 checks.noteBendApplied=!!doc.querySelector("#piano .note.bent.selected");
 checks.noteShapePreview=!!doc.querySelector("#note-expression svg polyline[points]");
 get("note-mode").click();
 checks.noteModeExits=get("note-mode").getAttribute("aria-pressed")==="false" &&
  !doc.querySelector(".work").classList.contains("editing-note-effects");
 checks.soundWaveVisible=!!doc.querySelector("#sound-visualizer svg.signal-scope-graph");
 checks.instrumentDialsVisible=!!doc.querySelector("#synth-editor .dial-knob[role='slider']");
 const pitchBefore=doc.querySelector("#sound-visualizer .signal-pitch")?.getAttribute("d");
 const knob=doc.querySelector("#synth-editor .dial-knob[aria-label='Glide from']");
 knob?.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowUp",bubbles:true}));
 checks.waveRespondsToDial=pitchBefore!==doc.querySelector("#sound-visualizer .signal-pitch")?.getAttribute("d");
 // Exercise the real preset browser and editor, not a mock copy.
 button.click();
 const library=get("instrument-dialog");
 checks.libraryOpens=library.open && library.querySelectorAll(".preset-card").length>=15;
 const card=library.querySelector('.preset-card[data-preset-id="neon-lead"]');
 const leadName=card?.querySelector(".preset-information strong")?.textContent;
 const choice=card?.querySelector(".preset-choose");
 if(choice)choice.click();
 // Sample instruments may require an asynchronous asset load; the test follows
 // the completed user operation, not the click's immediate synchronous frame.
 for(let attempt=0;attempt<90&&doc.querySelectorAll(".instrument-card").length!==2;attempt++)
  await new Promise(resolve=>setTimeout(resolve,25));
 diagnostics.preset={status:get("status").textContent,inst:doc.querySelectorAll(".instrument-card").length,libraryOpen:library.open,patch:get("instrument-name").value};
  checks.presetCreatesInstrument=doc.querySelectorAll(".instrument-card").length===2 && !library.open;
 checks.patchEditorPresent=!!doc.querySelector("#synth-editor .synth-group");
 checks.presetSelected=!!leadName&&get("instrument-name").value.includes(leadName);
 get("change-sound").click();
 checks.soundReplaceAccessible=library.open;
 const acid=library.querySelector('.preset-card[data-preset-id="acid-line"]');
 const acidName=acid?.querySelector(".preset-information strong")?.textContent;
 acid?.querySelector(".preset-choose")?.click();
 for(let attempt=0;attempt<40 && get("instrument-name").value!==acidName;attempt++)
  await new Promise(resolve=>setTimeout(resolve,25));
 checks.browseRenamesInstrument=!!acidName&&get("instrument-name").value===acidName;
 get("change-sound").click();
 get("close-library").click();
 checks.libraryCloses=!library.open;
 get("add-instrument").click();
 const piano=library.querySelector('.preset-card[data-preset-id="real-piano"]');
 const pianoName=piano?.querySelector(".preset-information strong")?.textContent;
 piano?.querySelector(".preset-choose")?.click();
 for(let attempt=0;attempt<120 && doc.querySelectorAll(".instrument-card").length!==3;attempt++)
  await new Promise(resolve=>setTimeout(resolve,25));
 diagnostics.sample={status:get("status").textContent,inst:doc.querySelectorAll(".instrument-card").length,libraryOpen:library.open,patch:get("instrument-name").value};
  checks.sampleCreatesInstrument=doc.querySelectorAll(".instrument-card").length===3 &&
  get("instrument-name").value.includes(pianoName||"!") && !library.open;
 checks.sampleControlsReachable=!!doc.querySelector("#synth-editor .sample-zones") &&
  !!doc.querySelector("#synth-editor .sample-replace-action");
 if(frame.clientWidth>=1400) {
  get("add-instrument").click();
  const steel=library.querySelector('.preset-card[data-preset-id="steel-guitar"]');
 const steelName=steel?.querySelector(".preset-information strong")?.textContent;
  steel?.querySelector(".preset-choose")?.click();
  for(let attempt=0;attempt<160&&doc.querySelectorAll(".instrument-card").length!==4;attempt++)
   await new Promise(resolve=>setTimeout(resolve,25));
  checks.guitarPresetAccessible=doc.querySelectorAll(".instrument-card").length===4 &&
   get("instrument-name").value.includes(steelName||"!");
  checks.guitarMappingCollapsible=!!doc.querySelector("#synth-editor .sample-map-details") &&
   !!doc.querySelector("#synth-editor .dial-knob[aria-label='Strum']");
 }


 // Examples are optional complete scores, not copy/pasted authoring surfaces.
 // A microphone is only requested when Start is pressed, never when opening.
 checks.recordingActionProminent=!!get("record-sound");
 get("record-sound").click();
 const microphone=get("microphone-dialog");
 checks.recorderOpensWithoutPermission=microphone.open &&
  get("mic-length").value==="1.5" &&
  get("mic-preview").hidden &&
  get("mic-capture").textContent.includes("countdown");
 checks.pitchConfirmationReachable=get("mic-root").options.length>=49;
 get("mic-close").click();
 checks.recorderCanClose=!microphone.open;
 checks.exampleButtonVisible=!!get("examples");
 get("examples").click();
 const gallery=get("example-dialog");
 checks.exampleGalleryOpens=gallery.open && gallery.querySelectorAll(".example-card").length===5;
 const proceed=frame.contentWindow.confirm;
 frame.contentWindow.confirm=()=>true;
 const demo=gallery.querySelector('.example-card[data-example-id="neon-after-hours"]');
 const demoName=demo?.querySelector("strong")?.textContent;
 demo?.click();
 for(let i=0;i<220&&get("title").value!==demoName;i++)
  await new Promise(resolve=>setTimeout(resolve,30));
 diagnostics.neon={status:get("status").textContent,title:get("title").value,inst:doc.querySelectorAll(".instrument-card").length,dialogOpen:gallery.open};
  checks.exampleUsesRealComposer=get("title").value===demoName &&
  doc.querySelectorAll(".instrument-card").length===8 &&
  doc.querySelectorAll(".arrangement-row").length===8 &&
  doc.querySelectorAll("#piano .rack-row").length===9 &&
  doc.querySelectorAll("#piano .note.filled").length>=1 &&
  !gallery.open;
 if(frame.clientWidth>=1400 && checks.exampleUsesRealComposer){
  // Exercise a full recorded composition with the real downloaded CC0 samples,
  // not just the synthetic-only example or a schema fixture.
  get("examples").click();
  frame.contentWindow.confirm=()=>true;
  const porch=gallery.querySelector('.example-card[data-example-id="porchlight"]');
   const porchName=porch?.querySelector("strong")?.textContent;
  porch?.click();
  for(let attempt=0;attempt<220&&get("title").value!==porchName;attempt++)
   await new Promise(resolve=>setTimeout(resolve,25));
  checks.sampleExampleLoaded=get("title").value===porchName &&
   doc.querySelectorAll(".instrument-card").length===6 &&
   doc.querySelectorAll(".arrangement-row").length===6 &&
   !gallery.open;
 }
 // Floating Signals must use a single interactive timeline: sixteen
 // source positions, no decorative lower strip, and exact shared bar edges.
 get("examples").click();
 frame.contentWindow.confirm=()=>true;
 const floating=gallery.querySelector('.example-card[data-example-id="floating-signals"]');
 const floatingName=floating?.querySelector("strong")?.textContent;
 floating?.click();
 for(let attempt=0;attempt<220&&get("title").value!==floatingName;attempt++)
  await new Promise(resolve=>setTimeout(resolve,25));
 const lanes=[...doc.querySelectorAll(".arrangement-row")];
 const headingBars=[...doc.querySelector(".arrangement-head").children].slice(1);
 let maxBoundaryError=0,allPositions=true;
 for(const lane of lanes){
  const slots=[...lane.querySelectorAll(".timeline-slot")];
  if(slots.length!==16){allPositions=false;break;}
  for(let bar=0;bar<16;bar++){
   const header=rect(headingBars[bar]),slot=rect(slots[bar]);
   maxBoundaryError=Math.max(maxBoundaryError,
    Math.abs(header.left-slot.left),Math.abs(header.width-slot.width));
   const clip=lane.querySelector('.phrase-clip[data-source-bar="'+bar+'"][data-repeat="0"]');
   if(clip){
    const bounds=rect(clip);
    maxBoundaryError=Math.max(maxBoundaryError,
     Math.abs(bounds.left-header.left),Math.abs(bounds.width-header.width));
   }
  }
 }
 checks.floatingSignalsSharedBarGeometry=get("title").value===floatingName &&
  lanes.length===4&&headingBars.length===16&&allPositions&&maxBoundaryError<2;
 checks.noDuplicatePhraseLane=doc.querySelectorAll(".phrase-segment").length===0 &&
  lanes.every(lane=>rect(lane).height<43)&&
  doc.querySelectorAll(".phrase-clip").length>0;
 const seventh=doc.querySelector('.arrangement-row .phrase-clip[data-source-bar="6"][data-repeat="0"]');
 seventh?.click();
 const getPlacementInput=prefix=>[...doc.querySelectorAll(".placement-settings input")]
  .find(input=>input.getAttribute("aria-label")?.startsWith(prefix));
 const offsetInput=getPlacementInput("Offset in bar");
 checks.placementControlsReachable=!!offsetInput&&!!getPlacementInput("Phrase length")&&
  !!getPlacementInput("Repetitions")&&!!getPlacementInput("Repeat every");
 // Drag vertically across the *number field*. This should commit to exactly
 // the same setting as manually entering 8, while preserving click-to-type.
 if(offsetInput){
  offsetInput.dispatchEvent(new frame.contentWindow.PointerEvent("pointerdown",
   {bubbles:true,pointerId:29,button:0,clientY:200}));
  doc.dispatchEvent(new frame.contentWindow.PointerEvent("pointermove",
   {bubbles:true,pointerId:29,button:0,clientY:120}));
  checks.draggingNumbersUpdatesValue=offsetInput.value==="8";
  doc.dispatchEvent(new frame.contentWindow.PointerEvent("pointerup",
   {bubbles:true,pointerId:29,button:0,clientY:120}));
 }
 const source=doc.querySelector('.arrangement-row .timeline-slot:nth-child(8)');
 const moved=doc.querySelector('.arrangement-row .phrase-clip[data-source-bar="6"][data-repeat="0"]');
 const offsetDifference=source&&moved?
  Math.abs(rect(moved).left-(rect(source).left+rect(source).width/2)):Infinity;
 checks.offsetBlockMatchesBeatThree=offsetDifference<3;
 checks.shiftedBlockClickable=!!moved&&moved.tagName==="BUTTON"&&
  moved.getAttribute("aria-haspopup")==="dialog";
 const repetitionsInput=getPlacementInput("Repetitions");
 if(repetitionsInput){
  repetitionsInput.value="3";
  repetitionsInput.dispatchEvent(new frame.contentWindow.Event("change",{bubbles:true}));
 }
 const intervalInput=getPlacementInput("Repeat every");
 if(intervalInput){
  intervalInput.value="12";
  intervalInput.dispatchEvent(new frame.contentWindow.Event("change",{bubbles:true}));
 }
 const phraseLengthInput=getPlacementInput("Phrase length");
 if(phraseLengthInput){
  phraseLengthInput.value="12";
  phraseLengthInput.dispatchEvent(new frame.contentWindow.Event("change",{bubbles:true}));
 }
 const clips=[0,1,2].map(index=>doc.querySelector(
  '.arrangement-row .phrase-clip[data-source-bar="6"][data-repeat="'+index+'"]'));
 const slot=doc.querySelector('.arrangement-row .timeline-slot:nth-child(8)');
 const spacing=slot?rect(slot).width*.75:0;
 checks.threeBeatPolymeterInOneRow=clips.every(Boolean)&&
  Math.abs(rect(clips[0]).width-spacing)<3&&
  Math.abs((rect(clips[1]).left-rect(clips[0]).left)-spacing)<3&&
  Math.abs((rect(clips[2]).left-rect(clips[1]).left)-spacing)<3&&
  lanes.every(lane=>rect(lane).height<43);
 frame.contentWindow.confirm=proceed;
 document.documentElement.dataset.layout=Object.values(checks).every(Boolean)?"PASS":"FAIL";
 document.getElementById("result").textContent=JSON.stringify({
  viewport:frame.clientWidth,
  sidebar:Math.round(sidebar.width),
  addButton:Math.round(add.width),
  checks,browserErrors,diagnostics
 });
 void fetch("/__layout_result?status="+document.documentElement.dataset.layout+"&details="+encodeURIComponent(document.getElementById("result").textContent)).catch(()=>{});
 }catch(error){
  document.documentElement.dataset.layout="FAIL";
  const details=String(error?.stack||error);
  document.getElementById("result").textContent=details;
  void fetch("/__layout_result?status=FAIL&details="+encodeURIComponent(details)).catch(()=>{});
 }
}
</script>
</head>
<body><iframe src="../index.html" title="Studio under test" onload="checkLayout(this)"></iframe><pre id="result" hidden></pre></body>
</html>
