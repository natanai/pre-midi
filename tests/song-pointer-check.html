<!doctype html><meta charset="utf-8">
<title>Song pointer gesture checks</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
<iframe id="studio" title="Studio"></iframe>
<script type="module">
import {create,resizeBeatBars} from "/schema.js";
import {createSong,addSongTrack} from "/songModel.js";
import {loadDraft} from "/storage.js";
const beat=create();resizeBeatBars(beat,4);
beat.instruments[0].chunks[0].notes=[{id:"gesture-note",pitch:60,start:2,duration:8,velocity:.8}];
const song=createSong(beat),track=song.tracks[0];
track.clips[0].startStep=16;
const other=addSongTrack(song,"beat");
localStorage.setItem("premidi-v5-draft",JSON.stringify(song));
window.gestureFixture={trackId:track.id,otherTrackId:other.id,clipId:track.clips[0].id,
 async read(){return JSON.parse(await loadDraft()||localStorage.getItem("premidi-v5-draft"));}};
document.getElementById("studio").src="/index.html";
</script>
