<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../studioAlignment.css">
<style>body{overflow:auto}.fixture{width:min(680px,100%);margin:auto}pre{white-space:pre-wrap}</style>
<div id="mount" class="fixture sound-section"></div><pre id="result">checking every sound control</pre>
<script type="module">
import {renderSoundInspectorCore} from "../soundInspector.js";
import {renderNoteExpression} from "../expressionUI.js";
import {renderAudioToneControls,renderAudioMovementControls,renderAudioArticulationControls,renderAudioDelayControls} from "../audioControlUI.js";
import {illustrateSoundPanel} from "../soundIllustrations.js";
import {assignSoundEdit} from "../soundEditPath.js";
import {teachingFixtures} from "./soundTeachingFixtures.js";
import {auditSoundVisualCoverage} from "./visualControlInventory.js";
import {createDial} from "../dial.js";
const started=performance.now(),root=document.querySelector("#mount"),checks={fixtures:[],knobs:0,inverseEdits:0,choices:0};
const assert=(ok,message)=>{if(!ok)throw Error(message)};
const at=(object,path)=>path.split(".").reduce((v,key)=>v?.[key],object);
const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
const key=(node,key)=>node.dispatchEvent(new KeyboardEvent("keydown",{key,bubbles:true,cancelable:true}));
const matches=(a,b)=>a===b||a.startsWith(b+".")||b.startsWith(a+".");
function fieldFor(control){
 return [...root.querySelectorAll("[data-sound-path]")].find(node=>
  node.dataset.soundPath===control.path&&
  (node.closest("[data-sound-domain]")?.dataset.soundDomain??"patch")===control.domain&&
  !node.closest(".visual-panel-area")&&node.querySelector("[role=slider],select,input"));
}
function editorFor(control){return fieldFor(control)?.querySelector("[role=slider],select,input")}
const panelFor=control=>fieldFor(control).closest(".visual-sound-panel")||
 root.querySelector('[data-visual-kind="stage"]');
function nodeFor(control){
 const exact=control.domain+":"+control.path;
 return [...panelFor(control).querySelectorAll("[data-sound-keys]")].find(node=>
  node.dataset.soundKeys.split("|").includes(exact));
}
function signalFor(control){
 return JSON.stringify([...panelFor(control).querySelectorAll("path[data-sound-role]")]
  .filter(node=>node.dataset.soundRole!=="guide"&&
   (node.dataset.soundLinks||"").split("|").some(path=>matches(path,control.path)))
  .map(node=>node.getAttribute("d")));
}
let status="FAIL";
try{
 const fixtures=teachingFixtures().filter(f=>["synth","factory default","inactive effects","sample",
  "one-shot recording","natural-end recording","vocal"].includes(f.name));
 for(const fixture of fixtures){
  for(const panel of root.querySelectorAll(".visual-sound-panel"))panel.disposeSoundIllustration?.();
  root.replaceChildren();
  const patch=structuredClone(fixture.patch),sound={id:"audit-"+fixture.name,name:"reference",gain:.8,referencePitch:60,patch};
  const instrument={id:"audit",name:"reference",volume:.65,layout:"pitched",sounds:[sound]};
  const scopeRoot=document.createElement("div"),modulesRoot=document.createElement("div"),
   volumeRoot=document.createElement("div"),gainRoot=document.createElement("div"),
   primaryRoots=Array.from({length:3},()=>document.createElement("div"));
  let core;
  const change=(path,value)=>{assignSoundEdit(patch,path,value);render();};
  function render(){
   if(patch.type==="vocal"){
    for(const panel of root.querySelectorAll(".visual-sound-panel"))panel.disposeSoundIllustration?.();
    root.replaceChildren();
    const visuals=[],preview=(path,value)=>{
     const copy=structuredClone(patch);assignSoundEdit(copy,path,value);
     visuals.forEach(v=>v.draw(copy));
    };
    for(const [kind,renderer,options] of [["sample",renderAudioArticulationControls,{context:"vocal"}],
     ["filter",renderAudioToneControls,{allowBypass:true,showCutoff:true}],
     ["movement",renderAudioMovementControls,{}],["delay",renderAudioDelayControls,{}]]){
     const details=document.createElement("details");details.open=true;
     details.append(document.createElement("summary"));
     const fields=document.createElement("div");fields.className="synth-fields";details.append(fields);
     renderer(fields,patch,change,preview,options);
     const visual=illustrateSoundPanel(details,kind,patch,change,preview,sound.id);
     root.append(visual.element);visuals.push(visual);
    }
   }else{
    root.replaceChildren(volumeRoot,gainRoot,scopeRoot,modulesRoot);
    core=renderSoundInspectorCore({instrument,sound,context:{bpm:120,bars:1,samples:[]},
     modulesRoot,scopeRoot,volumeRoot,gainRoot,primaryRoots,
     scopeRenderer:()=>{scopeRoot.replaceChildren();return ()=>{}},
     onPatchChange:change,
     onLevelChange:(path,value)=>{if(path==="volume")instrument.volume=value;else sound.gain=value;render()},
     onStageChange:edits=>{for(const [path,value] of edits){
      if(path[0]==="volume")instrument.volume=value;
      else if(path[0]==="gain")sound.gain=value;
      else assignSoundEdit(patch,path,value);
     }render();}
    });
   }
   for(const details of root.querySelectorAll("details"))details.open=true;
  }
  render();await tick();
  const audit=auditSoundVisualCoverage(root,{context:fixture.name});
  assert(!audit.missing.length,fixture.name+" knob-only controls: "+JSON.stringify(audit.missing));
  assert(!audit.inexact.length,fixture.name+" incomplete node ranges: "+JSON.stringify(audit.inexact));
  const controls=audit.controls.filter(c=>c.kind==="knob");
  const reset=async()=>{
   Object.assign(patch,structuredClone(fixture.patch));
   instrument.volume=.65;sound.gain=.8;render();await tick();
  };
  for(const control of controls){
   await reset();
   const context=fixture.name+" / "+control.domain+":"+control.path;
   let knob=editorFor(control);assert(knob,context+" missing real knob");
   knob.focus({preventScroll:true});
   assert(nodeFor(control),context+" focus did not reveal its paired node");
   const before=signalFor(control),old=Number(knob.getAttribute("aria-valuenow"));
   const end=old!==control.range.max;
   key(knob,end?"End":"Home");await tick();
   knob=editorFor(control);
   const value=Number(knob.getAttribute("aria-valuenow"));
   assert(value===(end?control.range.max:control.range.min),context+" knob endpoint failed");
   assert(signalFor(control)!==before,context+" changes only a dot, number or guide");
   const node=nodeFor(control);assert(node,context+" paired node disappeared after edit");
   const axis=JSON.parse(node.dataset.soundAxes).find(axis=>axis.path.join(".")===control.path);
   const sign=Math.sign(axis.to-axis.from)*(end?-1:1);
   const arrow=axis.mode.endsWith("X")?(sign>0?"ArrowRight":"ArrowLeft"):
    (sign>0?"ArrowDown":"ArrowUp");
   key(node,arrow);await tick();
   const expected=Number((Math.round((value+(end?-1:1)*axis.step)/axis.step)*axis.step).toFixed(4));
   const authored=control.domain==="stage"?(control.path==="volume"?instrument.volume:sound.gain):at(patch,control.path);
   assert(Math.abs(authored-expected)<1e-6,context+" node did not commit an exact knob step: "+authored+" != "+expected);
   assert(Math.abs(Number(editorFor(control).getAttribute("aria-valuenow"))-expected)<1e-6,
    context+" node did not update the original knob");
   checks.knobs++;checks.inverseEdits++;
  }
  // Inventory selectors and switches too. Root-note selectors have numeric
  // nodes; categorical choices have graph actions that use the real writer.
  for(const control of audit.controls.filter(c=>c.kind!=="knob")){
   await reset();
   const editor=editorFor(control);if(!editor)continue;
   editor.focus({preventScroll:true});
   const node=nodeFor(control);assert(node,fixture.name+" choice lacks direct graph edit: "+control.path);
   const old=editor.type==="checkbox"?editor.checked:editor.value;
   if(node.matches(".visual-graph-action"))node.click();else{
    const axis=JSON.parse(node.dataset.soundAxes).find(a=>a.path.join(".")===control.path);
    const increasing=Number(old)<axis.max;
    key(node,axis.mode.endsWith("X")?(increasing?"ArrowRight":"ArrowLeft"):
     (increasing?"ArrowUp":"ArrowDown"));
   }
   await tick();
   const after=editorFor(control);
   assert(after&&(after.type==="checkbox"?after.checked:after.value)!==old,
    fixture.name+" graph action does not update actual choice: "+control.path);
   checks.choices++;
  }
  checks.fixtures.push({name:fixture.name,...audit.summary});
  document.querySelector("#result").textContent="checking "+JSON.stringify(checks);
 }
 // Straight bend still stores an editable amount. Its node must remain
 // available while a dashed reference explains why the audible line is flat.
 const note={pitch:60,velocity:.6,bend:{shape:"straight",amount:2,rate:4}};
 let changed;
 root.replaceChildren();
 renderNoteExpression(root,note,"c4",1,bend=>changed=bend,()=>{},()=>{},null,()=>{});
 const dot=root.querySelector('.visual-graph-point[data-sound-links*="bend.amount"]');
 assert(!dot.hidden,"straight per-note bend hides its editable amount node");
 key(dot,"ArrowUp");
 assert(changed?.amount===2.25&&changed.shape==="straight","straight bend node must prepare amount without activating it");
 assert(root.querySelector(".visual-graph-secondary[points]")?.getAttribute("points"),"straight bend needs an explicit reference trace");
 // Negative control: the outer Sound level must never falsely qualify an
 // unillustrated sample gain dial just because both paths are named gain.
 root.replaceChildren();
 for(const domain of ["patch","stage"]){
  const field=createDial({label:"gain",min:0,max:domain==="patch"?2:1,step:.01},.5,()=>{});
  field.dataset.soundPath="gain";field.dataset.soundDomain=domain;root.append(field);
 }
 const details=document.createElement("details");details.append(document.createElement("summary"));
 const stage=illustrateSoundPanel(details,"stage",{type:"stage",layout:"levels",volume:.6,gain:.5,pan:0},()=>{});
 root.append(stage.element);
 const negative=auditSoundVisualCoverage(root);
 assert(negative.missing.length===1&&negative.missing[0].domain==="patch",
  "audit falsely accepts an outer Sound level node as sample gain coverage");
 root.querySelector('[data-sound-domain="stage"] [role=slider]').dataset.soundStep=".02";
 assert(auditSoundVisualCoverage(root).inexact.length===1,"audit must reject a node that lacks knob precision");
 checks.negativeControls=2;
 assert(checks.knobs>200&&checks.choices>25,"audit fixture unexpectedly lost real controls");
 status="PASS";
}catch(error){checks.error=String(error.stack||error)}
document.documentElement.dataset.result=status;
checks.seconds=Number(((performance.now()-started)/1000).toFixed(2));
document.querySelector("#result").textContent=status+" "+JSON.stringify(checks);
void fetch("/__sound_teaching_result?status="+status+"&details="+encodeURIComponent(JSON.stringify(checks)));
</script>
