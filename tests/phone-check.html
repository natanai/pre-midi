<!doctype html><html lang="en"><meta charset="utf-8"><title>Phone Notes browser fixture</title><body><script type="module">
const frame=document.createElement("iframe");
frame.src="/phone/";frame.title="Phone Notes composer";frame.style.cssText="width:390px;height:760px;border:0";
document.body.append(frame);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const wait=async(predicate,label)=>{
 for(let i=0;i<180;i++){
  try{if(predicate())return;}catch{}
  await sleep(90);
 }
 throw Error("timed out waiting for "+label);
};
const result=async(status,details)=>{
 await fetch("/__phone_result?status="+encodeURIComponent(status)+"&details="+encodeURIComponent(details));
};
try{
 await wait(()=>frame.contentDocument?.querySelector(".cell[data-row='60'][data-step='0']")&&
  frame.contentDocument?.querySelector("#status")?.textContent?.includes("ready"),"phone initialized");
 const doc=frame.contentDocument,one=()=>doc.querySelector(".cell[data-row='60'][data-step='0']");
 one().click();
 await wait(()=>one().classList.contains("filled"),"tap creates pitched note");
 if(doc.querySelector("#delete-note").disabled)throw Error("note selection not exposed");
 doc.querySelector("#delete-note").click();
 await wait(()=>!one().classList.contains("filled"),"explicit delete");
 doc.querySelector("#undo").click();
 await wait(()=>one().classList.contains("filled"),"undo");
 doc.querySelector("#redo").click();
 await wait(()=>!one().classList.contains("filled"),"redo");
 const target=doc.querySelector(".cell[data-row='62'][data-step='2']");
 const r=target.getBoundingClientRect(),x=r.left+12,y=r.top+12;
 const events=[["pointerdown",x,y],["pointermove",x+90,y],["pointerup",x+90,y]];
 for(const [type,clientX,clientY] of events)
  target.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerType:"touch",pointerId:7,isPrimary:true,button:0,clientX,clientY}));
 await wait(()=>doc.querySelector(".cell[data-row='62'][data-step='2']").classList.contains("filled"),"pointer gesture placed note");
 const painted=doc.querySelector(".cell[data-row='62'][data-step='4']");
 if(!painted.classList.contains("tail")&&!painted.classList.contains("end"))throw Error("touch paint duration did not extend");
 // The selected note has a visible handle on its final cell, not a hidden 14px hotspot.
 if(!painted.classList.contains("resize-handle"))throw Error("selected note end has no visible resize grip");
 const end=painted.getBoundingClientRect(),pointerNote=(type,x,y)=>{
  painted.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerType:"touch",pointerId:85,isPrimary:true,
   button:type==="pointermove"?-1:0,clientX:x,clientY:y}));
 };
 pointerNote("pointerdown",end.right-5,end.top+14);
 pointerNote("pointermove",end.right+79,end.top+14);
 pointerNote("pointerup",end.right+79,end.top+14);
 const newEnd=doc.querySelector(".cell[data-row='62'][data-step='6']");
 if(!newEnd.classList.contains("end")||!newEnd.classList.contains("resize-handle"))
  throw Error("dragging ↔ on an existing selected note did not extend its duration");
 const shortRect=newEnd.getBoundingClientRect();
 const pointerShort=(type,x)=>{
  newEnd.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerType:"touch",pointerId:86,isPrimary:true,
   button:type==="pointermove"?-1:0,clientX:x,clientY:shortRect.top+14}));
 };
 pointerShort("pointerdown",shortRect.right-4);
 pointerShort("pointermove",shortRect.right-46);
 pointerShort("pointerup",shortRect.right-46);
 if(!doc.querySelector(".cell[data-row='62'][data-step='5']").classList.contains("end"))
  throw Error("dragging selected note’s ↔ handle left did not shorten its duration");
 if(newEnd.classList.contains("end"))throw Error("shortened note still occupies its previous end");
 const cursor=doc.querySelector("#roll-playhead");
 if(!cursor||cursor.getAttribute("aria-hidden")!=="true")throw Error("stopped roll must hide its cursor");
 doc.querySelector("#play").click();
 await wait(()=>cursor.getAttribute("aria-hidden")==="false","chunk playhead to appear during playback");
 const startX=parseFloat(cursor.style.left);
 await sleep(190);
 const laterX=parseFloat(cursor.style.left);
 if(!(laterX>startX))throw Error("phone playback cursor did not advance across the grid");
 doc.querySelector("#play").click();
 await wait(()=>cursor.getAttribute("aria-hidden")==="true","stop to hide cursor");
 doc.querySelector("#instrument-picker").click();
 await wait(()=>doc.querySelector("#instruments-dialog").open,"instrument picker");
 doc.querySelector("#add-instrument").click();
 await wait(()=>doc.querySelector("#instrument-picker").textContent.includes("Instrument 2"),"new instrument");
 const scale=doc.querySelector("#scale-mode");scale.value="major";scale.dispatchEvent(new Event("change",{bubbles:true}));
 if(doc.querySelector("#scale-mode").value!=="major")throw Error("Scale not selected");
 // Exercise Safari-shaped pointer interruption and second-finger arbitration.
 const pointer=(target,type,id,x,y,isPrimary=true)=>target.dispatchEvent(new PointerEvent(type,{
  bubbles:true,cancelable:true,pointerType:"touch",pointerId:id,isPrimary,button:type==="pointermove"?-1:0,clientX:x,clientY:y
 }));
 const untouched=(pitch,step)=>doc.querySelector('.cell[data-row="'+pitch+'"][data-step="'+step+'"]');
 const interrupt=untouched(63,7),ir=interrupt.getBoundingClientRect();
 pointer(interrupt,"pointerdown",31,ir.left+9,ir.top+10);
 if(!interrupt.classList.contains("filled"))throw Error("interrupted gesture never created preview");
 pointer(interrupt,"pointermove",31,ir.left+90,ir.top+10);
 pointer(interrupt,"pointercancel",31,ir.left+90,ir.top+10);
 if(interrupt.classList.contains("filled"))throw Error("pointercancel committed a ghost note");
 const hidden=untouched(64,8),hr=hidden.getBoundingClientRect();
 pointer(hidden,"pointerdown",32,hr.left+9,hr.top+10);
 frame.contentWindow.dispatchEvent(new Event("pagehide"));
 if(hidden.classList.contains("filled"))throw Error("pagehide failed to roll back uncommitted note");
 const viewport=doc.querySelector("#roll-scroll"),vr=viewport.getBoundingClientRect();
 const first=untouched(65,9),second=untouched(66,10);
 const beforeZoom=parseFloat(doc.documentElement.style.getPropertyValue("--step"))||42;
 pointer(first,"pointerdown",41,vr.left+110,vr.top+125);
 if(!first.classList.contains("filled"))throw Error("first touch did not preview");
 pointer(second,"pointerdown",42,vr.left+210,vr.top+125,false);
 if(first.classList.contains("filled")||second.classList.contains("filled"))
  throw Error("second touch failed to cancel tentative note");
 pointer(first,"pointermove",41,vr.left+70,vr.top+125);
 pointer(second,"pointermove",42,vr.left+250,vr.top+125,false);
 const afterZoom=parseFloat(doc.documentElement.style.getPropertyValue("--step"));
 if(!(afterZoom>beforeZoom))throw Error("two-finger pinch did not zoom the grid");
 pointer(first,"pointerup",41,vr.left+70,vr.top+125);
 pointer(second,"pointerup",42,vr.left+250,vr.top+125,false);
 first.click();
 if(first.classList.contains("filled"))throw Error("a synthetic click after pinch inserted a note");
 const panButton=doc.querySelector("#pan-mode");
 panButton.click();
 if(panButton.getAttribute("aria-pressed")!=="true")throw Error("navigation mode inaccessible");
 const panCell=untouched(67,7),pr=panCell.getBoundingClientRect();
 viewport.scrollLeft=50;
 const oldScroll=viewport.scrollLeft;
 pointer(panCell,"pointerdown",51,pr.left+10,pr.top+10);
 pointer(panCell,"pointermove",51,pr.left-70,pr.top+10);
 pointer(panCell,"pointerup",51,pr.left-70,pr.top+10);
 if(!(viewport.scrollLeft>oldScroll))throw Error("explicit one-finger pan did not navigate time");
 if(panCell.classList.contains("filled"))throw Error("pan mode placed a note");
 panButton.click();
 if(panButton.getAttribute("aria-pressed")!=="false")throw Error("navigation mode did not exit");
 if(getComputedStyle(untouched(70,1)).touchAction!=="none")
  throw Error("note edit surface does not opt out of native scrolling");
 if(!getComputedStyle(doc.querySelector(".piano-key")).touchAction.includes("pan"))
  throw Error("piano key navigation strip does not allow native touch scroll");
 const phoneWindow=frame.contentWindow;
 if(!("serviceWorker" in phoneWindow.navigator))throw Error("service worker unavailable on local secure browser origin");
 await Promise.race([phoneWindow.navigator.serviceWorker.ready,
  new Promise((_,reject)=>setTimeout(()=>reject(Error("offline shell install timeout")),15000))]);
 const cacheNames=await phoneWindow.caches.keys();
 const activeName=cacheNames.find(name=>name.startsWith("pre-midi-phone-"));
 if(!activeName)throw Error("PWA did not install an offline shell cache");
 const offlineCache=await phoneWindow.caches.open(activeName);
 if(!await offlineCache.match(new URL("/schema.js",location.origin)))
  throw Error("Canonical Beat schema module is not available offline");
 await result("PASS","note edit, playback and installed PWA offline editor-shell cache");
}catch(error){
 await result("FAIL",error.stack||String(error));
}
</script></body></html>
