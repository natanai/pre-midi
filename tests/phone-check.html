<!doctype html><html lang="en"><meta charset="utf-8"><title>Phone Notes browser fixture</title><body><script type="module">
const frame=document.createElement("iframe");
frame.src="/phone/";frame.title="Phone Notes composer";frame.style.cssText="width:390px;height:760px;border:0";
document.body.append(frame);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const wait=async(predicate,label)=>{
 for(let i=0;i<180;i++){
  try{if(predicate())return;}catch{}
  await sleep(90);
 }
 throw Error("timed out waiting for "+label);
};
const result=async(status,details)=>{
 await fetch("/__phone_result?status="+encodeURIComponent(status)+"&details="+encodeURIComponent(details));
};
try{
 await wait(()=>frame.contentDocument?.querySelector(".cell[data-row='60'][data-step='0']")&&
  frame.contentDocument?.querySelector("#status")?.textContent?.includes("ready"),"phone initialized");
 const doc=frame.contentDocument,one=()=>doc.querySelector(".cell[data-row='60'][data-step='0']");
 one().click();
 await wait(()=>one().classList.contains("filled"),"tap creates pitched note");
 if(doc.querySelector("#delete-note").disabled)throw Error("note selection not exposed");
 if(doc.querySelector("#note-effects").disabled)throw Error("selected note effects not accessible");
 doc.querySelector("#note-effects").click();
 await wait(()=>doc.querySelector("#note-effects-dialog").open,"selected note effects");
 const bend=doc.querySelector('#phone-note-editor [aria-label="Held note bend shape"]');
 if(!bend)throw Error("canonical per-note bend controls missing");
 bend.value="wave";bend.dispatchEvent(new Event("change",{bubbles:true}));
 if(doc.querySelector('#phone-note-editor [aria-label="Held note bend shape"]')?.value!=="wave")
  throw Error("isolated note bend edit failed");
 const dynamic=doc.querySelector('#phone-note-editor [aria-label="Note level"]');
 dynamic.value=".55";dynamic.dispatchEvent(new Event("change",{bubbles:true}));
 if(Number(doc.querySelector('#phone-note-editor [aria-label="Note level"]')?.value)!==.55)
  throw Error("isolated note level change failed");
 doc.querySelector("#note-bend-default").click();
 if(!doc.querySelector("#note-bend-default").disabled)
  throw Error("return to instrument default bend did not remove note override");
 doc.querySelector("#note-effects-close").click();
 if(doc.querySelector("#note-effects-dialog").open)throw Error("note expression dialog refused to close");
 doc.querySelector("#delete-note").click();
 await wait(()=>!one().classList.contains("filled"),"explicit delete");
 doc.querySelector("#undo").click();
 await wait(()=>one().classList.contains("filled"),"undo");
 doc.querySelector("#redo").click();
 await wait(()=>!one().classList.contains("filled"),"redo");
 const target=doc.querySelector(".cell[data-row='62'][data-step='2']");
 const r=target.getBoundingClientRect(),x=r.left+12,y=r.top+12;
 const events=[["pointerdown",x,y],["pointermove",x+90,y],["pointerup",x+90,y]];
 for(const [type,clientX,clientY] of events)
  target.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerType:"touch",pointerId:7,isPrimary:true,button:0,clientX,clientY}));
 await wait(()=>doc.querySelector(".cell[data-row='62'][data-step='2']").classList.contains("filled"),"pointer gesture placed note");
 const painted=doc.querySelector(".cell[data-row='62'][data-step='4']");
 if(!painted.classList.contains("tail")&&!painted.classList.contains("end"))throw Error("touch paint duration did not extend");
 // The selected note has a visible handle on its final cell, not a hidden 14px hotspot.
 if(!painted.classList.contains("resize-handle"))throw Error("selected note end has no visible resize grip");
 const end=painted.getBoundingClientRect(),pointerNote=(type,x,y)=>{
  painted.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerType:"touch",pointerId:85,isPrimary:true,
   button:type==="pointermove"?-1:0,clientX:x,clientY:y}));
 };
 pointerNote("pointerdown",end.right-5,end.top+14);
 pointerNote("pointermove",end.right+79,end.top+14);
 pointerNote("pointerup",end.right+79,end.top+14);
 const newEnd=doc.querySelector(".cell[data-row='62'][data-step='6']");
 if(!newEnd.classList.contains("end")||!newEnd.classList.contains("resize-handle"))
  throw Error("dragging ↔ on an existing selected note did not extend its duration");
 const shortRect=newEnd.getBoundingClientRect();
 const pointerShort=(type,x)=>{
  newEnd.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerType:"touch",pointerId:86,isPrimary:true,
   button:type==="pointermove"?-1:0,clientX:x,clientY:shortRect.top+14}));
 };
 pointerShort("pointerdown",shortRect.right-4);
 pointerShort("pointermove",shortRect.right-46);
 pointerShort("pointerup",shortRect.right-46);
 if(!doc.querySelector(".cell[data-row='62'][data-step='5']").classList.contains("end"))
  throw Error("dragging selected note’s ↔ handle left did not shorten its duration");
 if(newEnd.classList.contains("end"))throw Error("shortened note still occupies its previous end");
 const cursor=doc.querySelector("#roll-playhead");
 if(!cursor||cursor.getAttribute("aria-hidden")!=="true")throw Error("stopped roll must hide its cursor");
 doc.querySelector("#play").click();
 await wait(()=>cursor.getAttribute("aria-hidden")==="false","chunk playhead to appear during playback");
 const startX=parseFloat(cursor.style.left);
 await sleep(190);
 const laterX=parseFloat(cursor.style.left);
 if(!(laterX>startX))throw Error("phone playback cursor did not advance across the grid");
 doc.querySelector("#play").click();
 await wait(()=>cursor.getAttribute("aria-hidden")==="true","stop to hide cursor");
 doc.querySelector("#instrument-picker").click();
 await wait(()=>doc.querySelector("#instruments-dialog").open,"instrument picker");
 doc.querySelector("#add-instrument").click();
 await wait(()=>doc.querySelector("#catalog-dialog").open,"factory Add Instrument selector");
 const init=doc.querySelector('#catalog-sounds [data-preset-id="init"]');
 if(!init)throw Error("factory Init sound missing from Add Instrument");
 init.querySelector('button[aria-label="add Init"]').click();
 await wait(()=>doc.querySelector("#instrument-picker").textContent.includes("Init"),"factory Instrument added");
 const scale=doc.querySelector("#scale-mode");scale.value="major";scale.dispatchEvent(new Event("change",{bubbles:true}));
 if(doc.querySelector("#scale-mode").value!=="major")throw Error("Scale not selected");
 // Exercise Safari-shaped pointer interruption and second-finger arbitration.
 const pointer=(target,type,id,x,y,isPrimary=true)=>target.dispatchEvent(new PointerEvent(type,{
  bubbles:true,cancelable:true,pointerType:"touch",pointerId:id,isPrimary,button:type==="pointermove"?-1:0,clientX:x,clientY:y
 }));
 const untouched=(pitch,step)=>doc.querySelector('.cell[data-row="'+pitch+'"][data-step="'+step+'"]');
 const interrupt=untouched(63,7),ir=interrupt.getBoundingClientRect();
 pointer(interrupt,"pointerdown",31,ir.left+9,ir.top+10);
 if(!interrupt.classList.contains("filled"))throw Error("interrupted gesture never created preview");
 pointer(interrupt,"pointermove",31,ir.left+90,ir.top+10);
 pointer(interrupt,"pointercancel",31,ir.left+90,ir.top+10);
 if(interrupt.classList.contains("filled"))throw Error("pointercancel committed a ghost note");
 const hidden=untouched(64,8),hr=hidden.getBoundingClientRect();
 pointer(hidden,"pointerdown",32,hr.left+9,hr.top+10);
 frame.contentWindow.dispatchEvent(new Event("pagehide"));
 if(hidden.classList.contains("filled"))throw Error("pagehide failed to roll back uncommitted note");
 const viewport=doc.querySelector("#roll-scroll"),vr=viewport.getBoundingClientRect();
 const first=untouched(65,9),second=untouched(66,10);
 const beforeZoom=parseFloat(doc.documentElement.style.getPropertyValue("--step"))||42;
 pointer(first,"pointerdown",41,vr.left+110,vr.top+125);
 if(!first.classList.contains("filled"))throw Error("first touch did not preview");
 pointer(second,"pointerdown",42,vr.left+210,vr.top+125,false);
 if(first.classList.contains("filled")||second.classList.contains("filled"))
  throw Error("second touch failed to cancel tentative note");
 pointer(first,"pointermove",41,vr.left+70,vr.top+125);
 pointer(second,"pointermove",42,vr.left+250,vr.top+125,false);
 const afterZoom=parseFloat(doc.documentElement.style.getPropertyValue("--step"));
 if(!(afterZoom>beforeZoom))throw Error("two-finger pinch did not zoom the grid");
 pointer(first,"pointerup",41,vr.left+70,vr.top+125);
 pointer(second,"pointerup",42,vr.left+250,vr.top+125,false);
 first.click();
 if(first.classList.contains("filled"))throw Error("a synthetic click after pinch inserted a note");
 const panButton=doc.querySelector("#pan-mode");
 panButton.click();
 if(panButton.getAttribute("aria-pressed")!=="true")throw Error("navigation mode inaccessible");
 const panCell=untouched(67,7),pr=panCell.getBoundingClientRect();
 viewport.scrollLeft=50;
 const oldScroll=viewport.scrollLeft;
 pointer(panCell,"pointerdown",51,pr.left+10,pr.top+10);
 pointer(panCell,"pointermove",51,pr.left-70,pr.top+10);
 pointer(panCell,"pointerup",51,pr.left-70,pr.top+10);
 if(!(viewport.scrollLeft>oldScroll))throw Error("explicit one-finger pan did not navigate time");
 if(panCell.classList.contains("filled"))throw Error("pan mode placed a note");
 panButton.click();
 if(panButton.getAttribute("aria-pressed")!=="false")throw Error("navigation mode did not exit");
 if(getComputedStyle(untouched(70,1)).touchAction!=="none")
  throw Error("note edit surface does not opt out of native scrolling");
 if(!getComputedStyle(doc.querySelector(".piano-key")).touchAction.includes("pan"))
  throw Error("piano key navigation strip does not allow native touch scroll");
 const phoneWindow=frame.contentWindow;
 if(!("serviceWorker" in phoneWindow.navigator))throw Error("service worker unavailable on local secure browser origin");
 await Promise.race([phoneWindow.navigator.serviceWorker.ready,
  new Promise((_,reject)=>setTimeout(()=>reject(Error("offline shell install timeout")),15000))]);
 const cacheNames=await phoneWindow.caches.keys();
 const activeName=cacheNames.find(name=>name.startsWith("pre-midi-phone-"));
 if(!activeName)throw Error("PWA did not install an offline shell cache");
 const offlineCache=await phoneWindow.caches.open(activeName);
 if(!await offlineCache.match(new URL("/schema.js",location.origin)))
  throw Error("Canonical Beat schema module is not available offline");
 // The phone's Sound tab must expose the actual shared synthesizer modules.
 doc.querySelector('[data-workspace="sound"]').click();
 await wait(()=>doc.querySelector("#phone-sound-content .synth-grid"),"sound editor rendered");
 if(doc.querySelectorAll("#phone-sound-content .visual-sound-panel").length<5)
  throw Error("phone Sound editor omitted shared DSP modules");
 const instrumentName=doc.querySelector("#phone-sound-content .phone-sound-title input");
 instrumentName.value="Phone synth";instrumentName.dispatchEvent(new Event("change",{bubbles:true}));
 if(!doc.querySelector("#phone-sound-content .phone-sound-title input").value.includes("Phone synth"))
  throw Error("phone instrument rename not applied");
 const soundWave=doc.querySelector('[aria-label="Wave (oscillators.0.wave)"]');
 if(!soundWave)throw Error("phone synth oscillator wave unavailable");
 soundWave.value="square";soundWave.dispatchEvent(new Event("change",{bubbles:true}));
 const applied=doc.querySelector('[aria-label="Wave (oscillators.0.wave)"]');
 if(applied?.value!=="square")throw Error("phone Wave patch change did not survive re-render");
 const volume=doc.querySelector('[aria-label="instrument level"]');
 volume.value=".45";volume.dispatchEvent(new Event("change",{bubbles:true}));
 if(Number(doc.querySelector('[aria-label="instrument level"]')?.value)!==.45)
  throw Error("phone Instrument volume did not commit");
 doc.querySelector('[aria-label="Save selected sound preset"]').click();
 await wait(()=>doc.querySelector("#preset-dialog").open,"save sound preset");
 doc.querySelector("#preset-name").value="Phone Favorite";
 doc.querySelector("#preset-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
 await wait(()=>!doc.querySelector("#preset-dialog").open,"preset saved");
 const saved=JSON.parse(frame.contentWindow.localStorage.getItem("premidi-user-sounds-v2")||"[]");
 if(!saved.some(entry=>entry.name==="Phone Favorite"))
  throw Error("phone saved preset not persisted at desktop library key");
 doc.querySelector('[data-workspace="notes"]').click();
 if(!doc.querySelector("#instrument-picker").textContent.includes("Phone synth"))
  throw Error("phone Sound rename did not propagate to Notes");
 doc.querySelector('[data-workspace="sound"]').click();
 if(doc.querySelector('[aria-label="Wave (oscillators.0.wave)"]')?.value!=="square")
  throw Error("phone Sound patch was lost on workspace switching");
 doc.querySelector('[data-workspace="notes"]').click();
 doc.querySelector("#instrument-picker").click();
 await wait(()=>doc.querySelector("#instruments-dialog").open,"phone instrument sheet");
 doc.querySelector("#add-instrument").click();
 await wait(()=>doc.querySelector("#catalog-dialog").open,"unified factory catalog");
 const mine=[...doc.querySelectorAll("#catalog-filters button")].find(button=>button.textContent==="Mine");
 if(!mine)throw Error("saved sounds missing from phone catalog filters");
 mine.click();
 if(!doc.querySelector("#catalog-sounds [data-preset-id='"+saved.find(entry=>entry.name==="Phone Favorite").id+"']"))
  throw Error("saved sound unavailable for reuse");
 const all=[...doc.querySelectorAll("#catalog-filters button")].find(button=>button.textContent==="All");
 all.click();
 const entries=doc.querySelectorAll("#catalog-sounds .phone-catalog-item");
 if(entries.length<15)throw Error("factory Sound catalog was not fully offered on phone");
 const item=doc.querySelector('#catalog-sounds [data-preset-id="init"]');
 if(!item)throw Error("factory Init preset missing from same browser");
 item.querySelector('button[aria-label="add Init"]').click();
 await wait(()=>!doc.querySelector("#catalog-dialog").open,"factory sound to add");
 if(!doc.querySelector("#instrument-picker").textContent.includes("Init"))
  throw Error("using shared sound factory did not create a playable Instrument");
 if(!doc.querySelector("#scale-summary").textContent.includes("scale"))
  throw Error("compact scale settings became unreachable");
 // Build an actual Song from the existing Beat and modify canonical Clips.
 doc.querySelector('[data-workspace="song"]').click();
 const createSong=doc.querySelector("#phone-song-content .phone-song-start button");
 if(!createSong)throw Error("Beat to Song conversion is missing on phone");
 createSong.click();
 await wait(()=>doc.querySelector(".phone-song-track"),"phone Song arrangement");
 const songControls=[...doc.querySelectorAll(".phone-song-actions button")];
 const action=text=>songControls.find(button=>button.textContent===text);
 if(!action("+ beat track")||!action("edit beat"))throw Error("Song track and Beat editor unavailable");
 action("+ beat track").click();
 await wait(()=>doc.querySelectorAll(".phone-song-track").length===2,"second Beat Track");
 const addClip=[...doc.querySelectorAll(".phone-song-track")].at(-1).querySelector(".phone-song-track-heading button");
 addClip.click();
 await wait(()=>doc.querySelectorAll(".phone-song-clip").length===2,"new Beat Clip");
 const settings=[...doc.querySelectorAll(".phone-song-track")].at(-1).querySelector(".phone-song-clip-settings");
 const steps=settings.querySelector('[aria-label="start step"]');steps.value="3";
 steps.dispatchEvent(new Event("change",{bubbles:true}));
 if(![...doc.querySelectorAll(".phone-song-track")].at(-1).querySelector('[aria-label="start step"]')?.value.includes("3"))
  throw Error("offset Song Clip edit failed");
 doc.querySelector("#play").click();
 await wait(()=>doc.querySelector("#phone-song-playhead")?.hidden===false,"Song playback line");
 doc.querySelector("#play").click();
 await wait(()=>doc.querySelector("#phone-song-playhead")?.hidden===true,"Song stop cursor");
 doc.querySelector("#project-actions").click();
 if(doc.querySelector("#export-song").hidden||!doc.querySelector("#render-wav"))
  throw Error("Song export or WAV render not available on phone");
 doc.querySelector("#export-song").click();
 await wait(()=>doc.querySelector("#file-dialog").open,"file export destination");
 if(![".premidi",".zip"].some(ext=>doc.querySelector("#file-name").textContent.endsWith(ext)))
  throw Error("Song export was not offered as a native .premidi or ZIP");
 if(!doc.querySelector("#file-download")||!doc.querySelector("#file-share"))
  throw Error("iOS file destination alternatives missing");
 doc.querySelector("#file-close").click();
 action("edit beat").click();
 if(doc.querySelector("#view-notes").hidden)throw Error("Song Beat cannot return to Notes editing");
 // Only explicit controls open microphone permission workflows.
 doc.querySelector('[data-workspace="song"]').click();
 const recordEntry=[...doc.querySelectorAll(".phone-song-actions button")].find(button=>button.textContent==="● voice");
 if(!recordEntry)throw Error("Song microphone entry is missing");
 recordEntry.click();
 if(!doc.querySelector("#voice-dialog").open||!doc.querySelector("#voice-start"))
  throw Error("Song microphone recorder does not open");
 doc.querySelector("#voice-close").click();
 if(doc.querySelector("#voice-dialog").open)throw Error("voice recorder cancel did not close");
 doc.querySelector('[data-workspace="notes"]').click();
 doc.querySelector("#instrument-picker").click();
 doc.querySelector("#add-instrument").click();
 const rec=[...doc.querySelectorAll("#catalog-sounds button")].find(button=>button.textContent.includes("record / import"));
 if(!rec)throw Error("phone factory catalog has no microphone/WAV import");
 rec.click();
 if(!doc.querySelector("#sample-dialog").open)throw Error("short sample dialog failed to open");
 if(!doc.querySelector("#sample-dialog [data-file]"))throw Error("WAV file input unavailable");
 doc.querySelector("#sample-dialog [data-close]").click();
 doc.querySelector("#catalog-close").click();
 doc.querySelector("#chunk-actions").click();
 await wait(()=>doc.querySelector("#chunks-dialog").open,"phone Chunk and Beat placement sheet");
 doc.querySelector("#chunk-new").click();
 await wait(()=>doc.querySelector("#chunk-picker").options.length===2,"new phone Chunk");
 if(!doc.querySelector("#chunk-location").textContent.includes("bar 2"))
  throw Error("new phone Chunk was not assigned to a playable Beat bar");
 doc.querySelector("#bar-offset").value="3";
 doc.querySelector("#bar-offset").dispatchEvent(new Event("change",{bubbles:true}));
 if(Number(doc.querySelector("#bar-offset").value)!==3)
  throw Error("phone bar offset failed");
 doc.querySelector("#chunk-duplicate").click();
 await wait(()=>doc.querySelector("#chunk-picker").options.length===3,"duplicate phone Chunk");
 if(!doc.querySelector("#chunk-location").textContent.includes("bar 3"))
  throw Error("duplicated Chunk lacks Beat placement");
 doc.querySelector("#chunks-close").click();
 await result("PASS","notes, isolated effects, preset saves, Song Clips, offline cache, mic entry, Files and playable Chunks");
}catch(error){
 await result("FAIL",error.stack||String(error));
}
</script></body></html>
