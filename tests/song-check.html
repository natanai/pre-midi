<!doctype html>
<meta charset="utf-8">
<title>Song interaction check</title>
<iframe id="studio" title="Studio" style="width:100vw;height:100vh;border:0"></iframe>
<script>
(async()=>{
 const frame=document.getElementById("studio"),issues=[];
 const assert=(condition,label)=>{if(!condition)throw Error(label);};
 const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const wait=async(predicate,label,limit=5000)=>{
  const deadline=Date.now()+limit;
  while(Date.now()<deadline){if(predicate())return;await pause(30);}
  throw Error("Timed out: "+label+"; startup errors: "+JSON.stringify({errors:frame.contentWindow?.__testBootErrors||[],resources:frame.contentWindow?.performance?.getEntriesByType("resource")?.slice(-12).map(e=>({name:e.name,status:e.responseStatus})),stage:frame.contentDocument?.readyState}));
 };
 const report=(status,detail)=>fetch("/__song_result?status="+status+"&details="+encodeURIComponent(detail)).catch(()=>{});
 try{
  frame.src="/index.html";
  await new Promise((resolve,reject)=>{
   frame.onload=resolve;
   frame.onerror=()=>reject(Error("Studio iframe failed to load"));
  });
  const win=frame.contentWindow,doc=frame.contentDocument,get=id=>frame.contentDocument.getElementById(id);
  const projectDownloads=[],wavDownloads=[];
  function captureDownloads(view){
   const createUrl=view.URL.createObjectURL.bind(view.URL);
   view.URL.createObjectURL=blob=>{
    if(blob.type==="audio/wav"){
     wavDownloads.push(blob);
    }else projectDownloads.push(blob);
    return createUrl(blob);
   };
   view.HTMLAnchorElement.prototype.click=function(){};
  }
  captureDownloads(win);
  const checkWav=async(blob,audible)=>{
   const data=await blob.arrayBuffer(),view=new DataView(data);
   assert(new TextDecoder().decode(new Uint8Array(data,0,4))==="RIFF","WAV header");
   assert(view.getUint16(22,true)===2&&view.getUint32(24,true)===44100,"stereo 44.1 kHz WAV");
   assert(view.getUint32(40,true)===data.byteLength-44&&data.byteLength>44,"complete WAV frame data");
   if(audible){let peak=0;for(let offset=44;offset<data.byteLength;offset+=2)peak=Math.max(peak,Math.abs(view.getInt16(offset,true)));assert(peak>10,"authored Song note must be audible in WAV");}
  };
  win.addEventListener("error",e=>issues.push(String(e.message||e.error)));
  win.addEventListener("unhandledrejection",e=>issues.push(String(e.reason)));
  await wait(()=>frame.contentDocument.querySelectorAll(".instrument-card").length>=1,"Beat editor initialized");
  assert(get("hear-sound").textContent.trim()==="▶","Sound preview is icon-only after initial render");
  get("hear-sound").click();
  assert(get("hear-sound").textContent.trim()==="▶","Sound preview remains icon-only after audition");
  assert(get("song-panel").hidden,"Song must be hidden until requested");
  // Short Beat durations keep full audio-export checks reliable in headless
  // mobile-sized Chrome without reducing test coverage of Beat/Song scopes.
  get("bars").value="2";
  get("bars").dispatchEvent(new Event("change",{bubbles:true}));
  const authored=doc.querySelector('#piano .note[aria-label^="C4, step 1,"]');
  authored.click();assert(doc.querySelectorAll("#piano .note.filled").length>0,"WAV fixture includes a real note");
  get("song-expand").click();
  await wait(()=>!get("song-panel").hidden&&frame.contentDocument.querySelectorAll(".song-beat-clip").length===1,"Song first open");
  // This fixture changes the Beat to two bars, but Clips retain their original
  // lengths unless explicitly resized. Avoid an unnecessary 8-bar WAV render.
  frame.contentDocument.querySelector(".song-beat-clip").click();
  get("song-clip-length").value="2";
  get("song-clip-length").dispatchEvent(new Event("change",{bubbles:true}));
  assert(frame.contentDocument.querySelector("#song-panel").compareDocumentPosition(frame.contentDocument.querySelector(".beat-header"))&Node.DOCUMENT_POSITION_FOLLOWING,"Song above Beat maker");
  const viewport=get("song-scroll"),ruler=get("song-ruler");
  const firstLane=frame.contentDocument.querySelector(".song-track-lane");
  assert(ruler.getBoundingClientRect().right>=viewport.getBoundingClientRect().right-2,"Ruler fills timeline viewport");
  assert(firstLane.getBoundingClientRect().right>=viewport.getBoundingClientRect().right-2,"Bar grid fills timeline viewport");
  assert(frame.contentDocument.querySelectorAll(".song-ruler-mark").length>=4,"Ruler labels continue across the timeline");
  assert(get("song-add-beat").parentElement.classList.contains("song-beat-add"),"Add Beat belongs below lanes");
  const footer=get("song-timeline-footer");
  assert(footer.parentElement===viewport,"Add Beat and navigation sit inside timeline scrollport, above scrollbar");
  assert(footer.getBoundingClientRect().bottom<=viewport.getBoundingClientRect().bottom,"Footer stays within scrollport");
  assert(get("song-visible-bars").textContent.includes("bars "),"Visible bar range is identified");
  get("song-later").click();
  await wait(()=>viewport.scrollLeft>4,"Navigate to later Song bars",7000);
  get("song-earlier").click();
  await wait(()=>viewport.scrollLeft<16,"Navigate to earlier Song bars",7000);
  get("song-add-beat").click();
  assert(!get("song-beat-choice").hidden,"Add Beat opens choice menu");
  assert(get("song-import-beat").textContent.trim()==="Add .premidi","Adding a Beat uses Add, not Open");
  get("song-new-beat").click();
  assert(get("song-beat-choice").hidden,"Choice menu closes after choosing New Beat");
  get("bars").value="2";
  get("bars").dispatchEvent(new Event("change",{bubbles:true}));
  // Resizing the source Beat does not implicitly resize its Song Clip.
  frame.contentDocument.querySelectorAll(".song-beat-clip")[1].click();
  get("song-clip-length").value="2";
  get("song-clip-length").dispatchEvent(new Event("change",{bubbles:true}));
  await wait(()=>frame.contentDocument.querySelectorAll(".song-track-row").length===2,"Second Beat Track");
  const beatName=get("title");
  beatName.value="Second Beat";beatName.dispatchEvent(new Event("change",{bubbles:true}));
  const firstTrackLabel=frame.contentDocument.querySelector(".song-track-row .song-track-open");
  assert(firstTrackLabel.textContent.trim()==="Untitled beat","First lane shows editable Beat name");
  firstTrackLabel.click();
  assert(get("title").value==="Untitled beat","Clicking Beat name opens Beat editor");
  const secondTrackLabel=frame.contentDocument.querySelectorAll(".song-track-open")[1];
  assert(secondTrackLabel.textContent.trim()==="Second Beat","Renamed Beat updates its lane name");
  secondTrackLabel.click();
  assert(get("title").value==="Second Beat","Clicking second Beat name switches edit context");
  assert(frame.contentDocument.querySelectorAll(".song-beat-clip").length===2,"Second Beat Clip");
  get("song-add-track").click();
  await wait(()=>frame.contentDocument.querySelectorAll(".song-track-row").length===3,"Empty Beat Track");
  const last=frame.contentDocument.querySelectorAll(".song-track-row")[2];
  last.querySelector(".song-add-clip").click();
  await wait(()=>frame.contentDocument.querySelectorAll(".song-beat-clip").length===3,"Clip in new Track");
  const original=frame.contentDocument.querySelector(".song-beat-clip"),id=original.dataset.clipId;
  original.click();
  assert(get("song-clip-settings").hidden===false,"Clip inspector appears");
  const start=get("song-clip-start");
  start.value="3";start.dispatchEvent(new Event("change",{bubbles:true}));
  const moving=frame.contentDocument.querySelector('[data-clip-id="'+id+'"]');
  assert(Math.abs(parseFloat(moving.style.left)-108)<1,"Clip starts at bar three");
  get("undo").click();
  const undone=frame.contentDocument.querySelector('[data-clip-id="'+id+'"]');
  assert(Math.abs(parseFloat(undone.style.left))<1,"Song Clip move can be undone");
  undone.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true}));
  const keyed=frame.contentDocument.querySelector('[data-clip-id="'+id+'"]');
  assert(Math.abs(parseFloat(keyed.style.left)-54)<1,"Keyboard moves clip by one bar");
  keyed.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowDown",bubbles:true}));
  const secondTrack=frame.contentDocument.querySelectorAll(".song-track-row")[1];
  assert(!!secondTrack.querySelector('[data-clip-id="'+id+'"]'),"Keyboard moves clip to another Track");
  const label=get("song-title");label.value="Arrangement check";label.dispatchEvent(new Event("change",{bubbles:true}));
  // The export dialog defaults to native instructions, regardless of Song scope.
  get("export").click();
  assert(get("export-dialog").open,"Export dialog opens");
  assert(get("export-form").querySelector('input[name="export-format"]:checked').value==="premidi","premidi is default format");
  assert(get("export-form").querySelector('input[name="export-scope"]:checked').value==="song","expanded Song selects Song export");
  get("export-form").querySelector('input[name="export-scope"][value="beat"]').click();
  const beatProjectCount=projectDownloads.length;
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>projectDownloads.length>beatProjectCount,"Beat premidi exported");
  get("export").click();
  const songProjectCount=projectDownloads.length;
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>projectDownloads.length>songProjectCount,"Song premidi exported");
  get("export").click();
  get("export-form").querySelector('input[name="export-format"][value="wav"]').click();
  const songDownload=wavDownloads.length;
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>wavDownloads.length>songDownload,"Song WAV downloaded",25000);
  await checkWav(wavDownloads.at(-1),true);
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="stop song","expanded Song playback started",7000);
  get("song-collapse").click();
  await wait(()=>get("play").getAttribute("aria-label")==="play beat"&&get("song-panel").hidden,"collapsing Song stops transport");
  get("export").click();
  assert(get("export-form").querySelector('input[name="export-scope"]:checked').value==="beat","collapsed Song selects Beat export");
  get("export-form").querySelector('input[name="export-format"][value="wav"]').click();
  const beatDownload=wavDownloads.length;
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>wavDownloads.length>beatDownload,"Beat WAV downloaded",25000);
  await checkWav(wavDownloads.at(-1),false);
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="stop beat","collapsed Song plays only selected Beat",7000);
  get("song-expand").click();
  await wait(()=>get("play").getAttribute("aria-label")==="play song"&&!get("song-panel").hidden,"expanding Song stops Beat playback");
  // The single transport button becomes stop while playing; clicking it resets playback.
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="stop song","single transport starts Song");
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="play song"&&get("play").textContent.includes("■")===false,"single transport stops Song");
  await wait(()=>get("status").dataset.saving==="false","Song saved locally",7000);
  await new Promise(resolve=>{frame.onload=resolve;frame.src="/index.html";});
  captureDownloads(frame.contentWindow);
  await wait(()=>frame.contentDocument.querySelectorAll(".song-track-row").length===3,"Song restored from local draft",7000).catch(error=>{
   const current=frame.contentWindow,document=frame.contentDocument;
   const cache=current.localStorage.getItem("premidi-v5-draft")||"";
   const detail={rows:document.querySelectorAll(".song-track-row").length,
    songHidden:document.getElementById("song-panel")?.hidden,
    heading:document.getElementById("title")?.value,
    status:document.getElementById("status")?.textContent,
    cacheSize:cache.length,cachePrefix:cache.slice(0,140),issues};
   throw Error(error.message+"; "+JSON.stringify(detail));
  });
  assert(get("song-title").value==="Arrangement check","Song title persisted");
  assert(frame.contentDocument.querySelectorAll(".song-beat-clip").length===3,"All Song clips persisted");
  assert(!get("song-panel").hidden,"Song remains expanded on reload");
  assert(get("song-ruler").getAttribute("aria-valuenow")==="1","Ruler start resets to bar one on a new load");
  assert(get("song-record").textContent.trim()==="● voice","Voice is the red Song toolbar entry");
  assert(!get("voice-dialog").open,"Voice setup is initially hidden");
  get("song-record").click();
  assert(get("voice-dialog").open,"Voice button opens recording setup before requesting permission");
  assert(get("voice-start").textContent.includes("play + record"),"Dialog explains what recording does");
  const alignment=get("voice-offset-ms");
  assert(!!alignment&&alignment.value==="0","Manual recording alignment is optional and defaults to zero");
  alignment.closest("details").open=true;
  alignment.value="55.5";alignment.dispatchEvent(new Event("change",{bubbles:true}));
  assert(frame.contentWindow.localStorage.getItem("premidi-recording-offset-ms")==="55.5",
   "Measured capture alignment persists in the browser profile");
  get("voice-start-bar").value="3";
  get("voice-start-bar").dispatchEvent(new Event("change",{bubbles:true}));
  assert(get("voice-start-bar").value==="3","Selected Song bar is a valid recording start");
  get("voice-count-in").value="1";
  get("voice-start").click();
  await wait(()=>get("voice-status").textContent.includes("Count-in"),"Optional count-in begins",9000);
  assert(get("voice-start").getAttribute("aria-pressed")!=="true",
   "Microphone take has not started during count-in");
  assert(get("voice-offset-ms").disabled,
   "Alignment cannot change after a synchronized take has started preparing");
  await wait(()=>get("voice-start").getAttribute("aria-pressed")==="true","Recording begins after count-in",11000);
  await pause(1000);
  get("voice-start").click();
  await wait(()=>frame.contentDocument.querySelectorAll(".song-vocal-clip").length===1,
   "microphone creates vocal clip",15000);
  assert(frame.contentDocument.querySelector(".song-track-row .song-vocal-clip"),
   "Vocal Track appears above Beat Tracks");
  const vocalPlacement=frame.contentDocument.querySelector(".song-vocal-clip");
  assert(Math.abs(parseFloat(vocalPlacement.style.left)-108)<1,
   "Vocal Clip starts at the selected third bar");
  frame.contentDocument.querySelector(".song-vocal-clip").click();
  assert(!get("song-vocal-level-field").hidden,"Vocal level control available");
  assert(!get("vocal-editor").hidden,"Vocal Clip opens the lower shared editing workspace");
  assert(frame.contentWindow.getComputedStyle(frame.contentDocument.querySelector(".work")).display==="none",
   "Voice edits replace the Beat grid without adding a separate editor");
  assert(frame.contentWindow.getComputedStyle(frame.contentDocument.querySelector(".beat-header")).display!=="none",
   "Playback transport stays visible during vocal editing");
  const visualKinds=new Set([...frame.contentDocument.querySelectorAll("#vocal-editor .visual-sound-panel")].map(node=>node.dataset.visualKind));
  for(const kind of ["sample","filter","movement","delay"])
   assert(visualKinds.has(kind),"Vocal Sound shares the sampler's "+kind+" interactive illustration");
  const filterOff=frame.contentDocument.querySelector('#vocal-editor select[aria-label="Recorded sound filter type"]');
  assert(filterOff.value==="off","An unfiltered vocal clearly shows that its filter is off");
  const graphOff=frame.contentDocument.querySelector('#vocal-editor [data-visual-kind="filter"]');
  assert(graphOff.querySelectorAll(".visual-graph-point").length===0,
   "The bypassed filter must not pretend to have an active frequency handle");
  filterOff.value="lowpass";filterOff.dispatchEvent(new Event("change",{bubbles:true}));
  assert(frame.contentDocument.querySelector('#vocal-editor [data-sound-path="filter.cutoff"]'),
   "Enabling filter reveals the same brightness control used for sampled sounds");
  assert(frame.contentDocument.querySelector('#vocal-editor [data-visual-kind="filter"] .visual-graph-point'),
   "Enabling the vocal filter makes the shared response graph interactive");
  get("song-vocal-level").value="1.3";
  get("song-vocal-level").dispatchEvent(new Event("change",{bubbles:true}));
  get("export").click();
  const vocalProjectCount=projectDownloads.length;
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>projectDownloads.length>vocalProjectCount,"vocal ZIP exported",9000);
  await wait(()=>get("status").dataset.saving==="false","recorded Song saved locally",7000);
  await new Promise(resolve=>{frame.onload=resolve;frame.src="/index.html";});
  captureDownloads(frame.contentWindow);
  await wait(()=>frame.contentDocument.querySelectorAll(".song-vocal-clip").length===1,
   "recorded Vocal Clip restored after reload",9000);
  assert(frame.contentDocument.querySelector(".song-track-row .song-vocal-clip"),
   "restored Vocal Track is still above Beats");
  get("song-record").click();
  assert(get("voice-offset-ms").value==="55.5","Recording alignment survives browser reload");
  get("voice-close").click();
  get("play").click();
  await wait(()=>get("play").getAttribute("aria-label")==="stop song",
   "restored Vocal Clip decodes and plays",9000);
  get("play").click();
  get("export").click();
  get("export-form").querySelector('input[name="export-format"][value="wav"]').click();
  const vocalWavCount=wavDownloads.length;
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>wavDownloads.length>vocalWavCount||get("status").textContent.includes("Export failed"),
   "Song with vocal renders WAV",25000);
  assert(wavDownloads.length>vocalWavCount,"recorded Song produced a WAV file");
  await checkWav(wavDownloads.at(-1),true);
  const recordedVoice=frame.contentDocument.querySelector(".song-vocal-clip");
  const voiceId=recordedVoice.dataset.clipId;
  recordedVoice.click();
  assert(!get("song-beat-start-field").hidden,"Voice clips can edit their start bar");
  assert(!get("song-vocal-step-field").hidden,"Voice timing includes sixteenth-note step placement");
  const trim=frame.contentDocument.querySelector("#vocal-editor .vocal-timing input");
  trim.value="0.02";trim.dispatchEvent(new Event("change",{bubbles:true}));
  assert(frame.contentDocument.querySelector("#vocal-editor .vocal-timing input").value==="0.02","Voice trim is editable in seconds");
  const wave=frame.contentDocument.querySelector("#vocal-editor .audio-waveform-editor");
  assert(!!wave,"Vocal editor has a reusable waveform editing surface");
  const handle=wave.querySelector('[role="slider"][aria-label="trim start"]');
  assert(!!handle,"Waveform trim marker is accessible by keyboard and pointer");
  const painted=handle.getBoundingClientRect(),viewport=wave.querySelector("svg").getBoundingClientRect();
  assert(painted.left-viewport.left<viewport.width*.05,
   "A near-zero trim handle is painted at the left edge, without SVG letterboxing");
  assert(Math.abs(Number(handle.getAttribute("aria-valuenow"))-.02)<.0005,"Waveform marker reflects saved clip trim");
  const zoom=wave.querySelector('select[aria-label="waveform zoom"]');
  const initialViewport=wave.querySelector(".audio-waveform-tools").textContent;
  zoom.value="8";zoom.dispatchEvent(new Event("change",{bubbles:true}));
  assert(zoom.value==="8"&&wave.querySelector(".audio-waveform-tools").textContent!==initialViewport,
   "Waveform zoom changes the displayed source-time window");
  handle.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true}));
  assert(Math.abs(Number(frame.contentDocument.querySelector("#vocal-editor .vocal-timing input").value)-.021)<.0005,
   "Keyboard trimming commits a one-millisecond edit");
  const dragEditor=frame.contentDocument.querySelector("#vocal-editor .audio-waveform-editor");
  const dragSvg=dragEditor.querySelector("svg"),dragHandle=dragEditor.querySelector(".audio-trim-handle");
  const dragBox=dragSvg.getBoundingClientRect();
  const handleX=Number(dragSvg.querySelector('line[stroke="#ddd"]').getAttribute("x1"));
  const pointerStart=dragBox.left+handleX/480*dragBox.width;
  // Synthetic PointerEvents don't register in Chromium's native capture table.
  // Shim capture only; exercise the actual source-time drag and single commit logic.
  dragSvg.setPointerCapture=()=>{};
  const pointer=(type,x)=>new PointerEvent(type,{bubbles:true,pointerId:84,pointerType:"mouse",button:0,clientX:x});
  dragHandle.dispatchEvent(pointer("pointerdown",pointerStart));
  dragHandle.dispatchEvent(pointer("pointermove",pointerStart+20));
  const previewTrim=Number(frame.contentDocument.querySelector("#vocal-editor .vocal-timing input").value);
  assert(previewTrim>.021&&dragEditor.isConnected,"Dragging previews a larger trim without rerendering the editor");
  dragHandle.dispatchEvent(pointer("pointerup",pointerStart+20));
  assert(!dragEditor.isConnected,"Pointer release commits exactly once through the Song editor");
  assert(Math.abs(Number(frame.contentDocument.querySelector("#vocal-editor .vocal-timing input").value)-previewTrim)<.001,
   "Committed drag trim matches the preview");
  get("undo").click();
  assert(Math.abs(Number(frame.contentDocument.querySelector("#vocal-editor .vocal-timing input").value)-.021)<.001,
   "Undo restores the original voice trim without changing recording bytes");
  get("song-clip-start").value="5";
  get("song-clip-start").dispatchEvent(new Event("change",{bubbles:true}));
  let shifted=frame.contentDocument.querySelector('[data-clip-id="'+voiceId+'"]');
  assert(Math.abs(parseFloat(shifted.style.left)-216)<1,"Voice clip moved to bar five");
  get("undo").click();
  shifted=frame.contentDocument.querySelector('[data-clip-id="'+voiceId+'"]');
  assert(Math.abs(parseFloat(shifted.style.left)-108)<1,"Vocal timing can be undone");
  shifted.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true}));
  shifted=frame.contentDocument.querySelector('[data-clip-id="'+voiceId+'"]');
  assert(Math.abs(parseFloat(shifted.style.left)-121.5)<1,"ArrowRight advances a vocal one beat");
  shifted.click();
  const duplicate=[...frame.contentDocument.querySelectorAll("#vocal-editor .vocal-editor-actions button")].find(b=>b.textContent==="duplicate");
  assert(!!duplicate,"Vocal editor provides Clip duplication");
  duplicate.click();
  assert(frame.contentDocument.querySelectorAll(".song-vocal-clip").length===2,"Duplicate creates another Clip");
  assert(frame.contentDocument.querySelectorAll(".song-track-row").length===4,"Duplicate stays on the same voice track");
  get("song-clip-remove").click();
  assert(frame.contentDocument.querySelectorAll(".song-vocal-clip").length===1,"Remove duplicate without removing the original");
  frame.contentDocument.querySelector('[data-clip-id="'+voiceId+'"]').click();
  get("song-clip-remove").click();
  assert(frame.contentDocument.querySelectorAll(".song-vocal-clip").length===0,"Vocal clip removed");
  assert(frame.contentDocument.querySelectorAll(".song-track-row").length===3,
   "Removing the only take removes the empty voice row and preserves Beats");
  get("export").click();
  const cleanedProjectCount=projectDownloads.length;
  get("export-form").querySelector('input[name="export-format"][value="premidi"]').click();
  get("export-form").dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
  await wait(()=>projectDownloads.length>cleanedProjectCount,"Song exported after deleting take");
  const cleanedBytes=new Uint8Array(await projectDownloads.at(-1).arrayBuffer());
  assert(!(cleanedBytes[0]===80&&cleanedBytes[1]===75),"Deleted recordings must not remain in Song ZIP");
  assert(issues.length===0,"Browser exceptions: "+issues.join(", "));
  document.documentElement.dataset.result="PASS";
  await report("PASS","Song clips, layering, keyboard, undo, playback, reload");
 }catch(error){
  document.documentElement.dataset.result="FAIL";
  await report("FAIL",String(error?.stack||error));
 }
})();
</script>
