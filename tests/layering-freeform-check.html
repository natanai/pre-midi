<!doctype html>
<meta charset="utf-8">
<title>Attached freeform layering and keyboard movement</title>
<link rel="stylesheet" href="/freeform.css">
<div id="root"></div>
<script type="module">
import {create} from "/schema.js";
import {createSong,upgradeSongFeatures} from "/songModel.js";
import {ensureFreeform,addFreeformInstrument,addFreeformNote,
 eventsAtFreeformStep} from "/freeformModel.js";
import {installFreeformUI} from "/freeformUI.js";
const assert=(ok,message)=>{if(!ok)throw Error(message)};
const report=(status,details)=>fetch("/__song_result?status="+status+
 "&details="+encodeURIComponent(details)).catch(()=>{});
try{
 const song=createSong(create()),track=song.tracks[0];
 track.clips[0].startStep=16;
 const free=ensureFreeform(track),instrument=addFreeformInstrument(free);
 const passage={id:"test-passage",startStep:16,lengthSteps:16};
 free.passages.push(passage);
 addFreeformNote(instrument,{pitch:60,start:16,duration:8,velocity:.8,passageId:passage.id});
 addFreeformNote(instrument,{pitch:60,start:32,duration:8,velocity:.7});
 upgradeSongFeatures(song);
 const root=document.querySelector("#root");
 let controller;
 controller=installFreeformUI({root,getSong:()=>song,onError:message=>{throw Error(message)},
  onChange:change=>{
   change();
   root.querySelector(".song-freeform-row")?.replaceWith(controller.renderAttached(track,864));
   return true;
  }
 });
 root.append(controller.renderAttached(track,864));
 let button=root.querySelector(".song-freeform-passage");
 assert(button,"Passage is shown inside parent-attached freeform row");
 assert(button.title.includes("Alt+arrow"),"Passage advertises keyboard movement");
 assert(button.classList.contains("song-freeform-layered"),
  "Parent linked Beat Clip layer is visibly indicated");
 button.focus();
 assert(button.getAttribute("aria-label").includes("linked Beat Clip"),
  "Accessible preview explains linked Beat layering");
 button.dispatchEvent(new KeyboardEvent("keydown",{
  key:"ArrowRight",altKey:true,bubbles:true,cancelable:true
 }));
 assert(passage.startStep===32,"Alt+right moves attached passage one bar");
 assert(instrument.notes[0].start===32,"Owned freeform note moved with passage");
 assert(instrument.notes[1].start===32,"Unowned freeform note stays where it was");
 assert(track.clips[0].startStep===16,"Parent linked Beat Clip was not detached or moved");
 button=root.querySelector(".song-freeform-passage");
 assert(button.classList.contains("song-freeform-note-overlap"),
  "New same-pitch layering receives a visible nonblocking indicator");
 assert(button.title.includes("both notes will sound"),
  "Indicator describes intentional simultaneous playback");
 assert(button.querySelector(".song-freeform-layering-hint")?.textContent.includes("1"),
  "Compact overlay summarizes one matching note overlap");
 button.dispatchEvent(new KeyboardEvent("keydown",{
  key:"ArrowLeft",altKey:true,shiftKey:true,bubbles:true,cancelable:true
 }));
 assert(passage.startStep===31,"Shift+Alt+left moves a passage by one step");
 assert(instrument.notes[0].start===31,"Step movement preserves source-note ownership");
 controller.open(track.id,passage.id);
 let notes=[...root.querySelectorAll(".freeform-roll-note")];
 assert(notes.length===2,"Both independently editable overlapping notes remain in the roll");
 assert(notes.every(note=>note.classList.contains("layered")),
  "The overlapped notes show distinct stacked visual lanes");
 assert(notes[0].style.top!==notes[1].style.top,
  "Simultaneous voices must not paint directly over each other");
 notes[0].click();
 const choice=root.querySelector('select[aria-label="Choose overlapping freeform note"]');
 assert(choice&&choice.options.length===2,
  "Selecting an overlap exposes both notes without modifying the Song");
 const duplicate=[...root.querySelectorAll("button")]
  .find(node=>node.textContent==="+ layer note");
 assert(duplicate,"Selected notes provide explicit non-destructive layering");
 duplicate.click();
 assert(instrument.notes.length===3,"Layering keeps the original notes and adds one new identity");
 assert(new Set(instrument.notes.map(note=>note.id)).size===3,
  "Every layered note has a distinct editable identity");
 assert(root.querySelectorAll(".freeform-roll-note").length===3,
  "All three concurrent notes remain represented in the roll");
 const selected=instrument.notes.at(-1);
 const addMovement=[...root.querySelectorAll("button")]
  .find(node=>node.textContent==="move cutoff over time");
 assert(addMovement,"Selected freeform synth notes can author new cutoff curves");
 addMovement.click();
 assert(selected.cutoffAutomation?.version===1&&free.version===2,
  "New cutoff movement uses canonical per-note captured automation and freeform v2");
 const graph=root.querySelector(".freeform-note-cutoff .visual-sound-panel");
 assert(graph&&graph.querySelector("svg"),"Per-note cutoff opens the shared interactive graph");
 const fields=[...root.querySelectorAll(".freeform-note-cutoff input[type=number]")];
 assert(fields.length===4,"Cutoff graph retains editable begin/end step and frequency values");
 fields.at(-1).value="2100";
 fields.at(-1).dispatchEvent(new Event("change",{bubbles:true}));
 assert(selected.cutoffAutomation?.block.points[1].value===2100,
  "Numeric edit changes the same curve shown by the two-axis illustration");
 let graphHandle=[...root.querySelectorAll(".freeform-note-cutoff .visual-graph-point")].at(-1);
 assert(graphHandle?.getAttribute("aria-description")?.includes("left/right")&&
  graphHandle.getAttribute("aria-description")?.includes("up/down"),
  "Cutoff endpoint is an educational, keyboard-accessible two-axis illustration");
 const oldEnd=selected.cutoffAutomation.block.points[1].step;
 graphHandle.dispatchEvent(new KeyboardEvent("keydown",{
  key:"ArrowLeft",bubbles:true,cancelable:true
 }));
 assert(selected.cutoffAutomation.block.points[1].step===oldEnd-1,
  "Graph horizontal axis edits the same endpoint position as the numeric input");
 graphHandle=[...root.querySelectorAll(".freeform-note-cutoff .visual-graph-point")].at(-1);
 graphHandle.dispatchEvent(new KeyboardEvent("keydown",{
  key:"ArrowUp",bubbles:true,cancelable:true
 }));
 assert(selected.cutoffAutomation.block.points[1].value>2100,
  "Graph vertical axis edits the same real cutoff frequency as the numeric input");
 upgradeSongFeatures(song);
 assert(song.version>=23,"New freeform note automation upgrades the native Song instruction version");
 let actions=root.querySelector(".freeform-instrument-menu");
 assert(actions?.querySelector('summary[aria-label="Instrument actions"]'),
  "Existing Instrument controls expose one compact accessible actions menu");
 actions.open=true;
 actions.querySelector(".freeform-instrument-copy").click();
 assert(free.instruments.length===2,"Instrument duplication creates a second editable lane");
 const copied=free.instruments[1];
 assert(copied.id!==instrument.id&&copied.notes.length===instrument.notes.length,
  "Copied Instrument keeps all notes with a new independent identity");
 assert(copied.notes.every((note,i)=>note.id!==instrument.notes[i].id),
  "Copied notes are independently addressable");
 assert(copied.notes.at(-1).cutoffAutomation?.block.points[1].value===
  instrument.notes.at(-1).cutoffAutomation?.block.points[1].value,
  "Note-level cutoff movement survives an Instrument duplicate");
 actions=root.querySelector(".freeform-instrument-menu");actions.open=true;
 actions.querySelector(".freeform-instrument-up").click();
 assert(free.instruments[0].id===copied.id,"Move up reorders the Instrument without changing its notes");
 actions=root.querySelector(".freeform-instrument-menu");actions.open=true;
 actions.querySelector(".freeform-instrument-down").click();
 assert(free.instruments[1].id===copied.id,"Move down restores the Instrument order");
 const originalConfirm=window.confirm;
 window.confirm=()=>true;
 try{
  actions=root.querySelector(".freeform-instrument-menu");actions.open=true;
  actions.querySelector(".freeform-instrument-remove").click();
 }finally{window.confirm=originalConfirm;}
 assert(free.instruments.length===1&&free.instruments[0].id===instrument.id,
  "Removing a duplicate preserves its source Instrument and notes");
 assert(root.querySelector('select[aria-label="Freeform Instrument"]').value===instrument.id,
  "Removing the selected Instrument switches to the surviving one");
 const sourceChunk=instrument.chunks[0];
 sourceChunk.notes=[{id:"browser-chunk-note",pitch:72,start:2,duration:4,velocity:.73}];
 const originalChunk=JSON.stringify(sourceChunk);
 const placeChunk=[...root.querySelectorAll(".freeform-chunk-tools button")]
  .find(node=>node.textContent==="place Chunk");
 assert(placeChunk,"Reusable Chunks have a placement action");
 placeChunk.click();
 assert(instrument.chunkPlacements.length===1,
  "Placing a Chunk creates one Song-time placement without copying notes");
 const placed=instrument.chunkPlacements[0],originalId=placed.id;
 const edit=(ariaLabel,value)=>{
  const node=root.querySelector('input[aria-label="'+ariaLabel+'"]');
  assert(node,"Placed Chunk exposes "+ariaLabel);
  node.value=String(value);
  node.dispatchEvent(new Event("change",{bubbles:true}));
 };
 edit("Placed Chunk start bar",4);
 edit("Placed Chunk start step",3);
 edit("Placed Chunk repetitions",3);
 edit("Placed Chunk spacing in steps",12);
 edit("Placed Chunk onset window in steps",8);
 assert(placed.id===originalId&&placed.startStep===50&&placed.repeats===3&&
  placed.every===12&&placed.length===8,
  "Editing a placed Chunk preserves its identity and supports offsets and polymeter");
 assert([52,64,76].every(step=>eventsAtFreeformStep(free,step)
  .some(event=>event.note.pitch===72)),
  "Every placed repeat still sounds the reusable source notes on time");
 assert(JSON.stringify(sourceChunk)===originalChunk,
  "Editing placement never changes reusable Chunk notes");
 root.querySelector(".freeform-placement-remove").click();
 assert(instrument.chunkPlacements.length===0&&
  JSON.stringify(sourceChunk)===originalChunk,
  "Removing placement never deletes or modifies its reusable Chunk");
 await report("PASS","Layered notes, note cutoff, Instrument lifecycle and editable reusable Chunk placements");
}catch(error){await report("FAIL",String(error.stack||error))}
</script>
