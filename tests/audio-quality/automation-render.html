<!doctype html><meta charset="utf-8"><title>Cutoff automation qualification</title><script type="module">
import {planSynthVoice} from '../../src/dsp/synth-voice.js';import {scheduleSynthPlan,scheduleNote,wav,renderEvents,play} from '../../audio.js';import {cleanPatch} from './fixtures.js';import {modulationFixtures} from './modulation-fixtures.js';import {signalStats,difference,spectrum} from './metrics.js';import {create,upgradeBeatFeatures,clone} from '../../schema.js';import {createSong} from '../../songModel.js';
let report;try{
 const results=[],failures=[],add=(id,metrics,checks)=>{const bad=Object.keys(checks).filter(key=>!checks[key]);failures.push(...bad.map(check=>({id,check})));results.push({id,metrics,checks,status:bad.length?'fail':'pass'});};
 const lane={version:1,target:'filter.cutoff',unit:'hz',interpolation:'exponential',points:[{id:'begin',step:0,value:8000},{id:'end',step:8,value:300}]};
 const render=async(plan,rate,seconds=1.1)=>{const c=new OfflineAudioContext(2,Math.ceil(rate*seconds),rate);scheduleSynthPlan(c,c.destination,plan);return c.startRendering();};
 for(const rate of [44100,48000,96000])for(const position of [0,4,8])for(const modulated of [false,true]){
  const patch=modulated?modulationFixtures().find(f=>f.id==='maximum-16').patch:cleanPatch('sawtooth');const start=(441.5)/rate,plan=planSynthVoice({patch,volume:.3},{pitch:60,velocity:.8},start,.8,{automation:lane,timeline:{step:position,unit:.125,limitStep:16}}),frames=Math.ceil(rate*1.1);
  const response=await fetch('/__native_render',{method:'POST',body:JSON.stringify({plan,sampleRate:rate,frames})});if(!response.ok)throw Error(await response.text());const pcm=new Float32Array(await response.arrayBuffer()),browser=await render(plan,rate),errors=[0,1].map(ch=>difference(Float32Array.from({length:frames},(_,i)=>pcm[2*i+ch]),browser.getChannelData(ch))),max=Math.max(...errors.map(e=>e.max)),rms=Math.max(...errors.map(e=>e.rms));
  add('native/'+rate+'/'+position+'/'+modulated,{max,rms,version:plan.version,startValue:plan.automation.points[0].value,stats:signalStats(pcm)},{pcmMax:max<.0001,pcmRms:rms<.00002,finite:signalStats(pcm).nonFinite===0,correctSeekStart:Math.abs(plan.automation.points[0].value-8000*(300/8000)**(Math.min(position,8)/8))<1e-8});
 }
 const patch=cleanPatch('sawtooth'),plan=planSynthVoice({patch,volume:.3},{pitch:60,velocity:1},0,1.2,{automation:lane,timeline:{step:0,unit:.125,limitStep:16}}),moving=(await render(plan,48000,1.5)).getChannelData(0);
 const centroid=at=>{const p=spectrum(moving.subarray(Math.round(at*48000),Math.round(at*48000)+8192));let energy=0,weighted=0;for(let i=1;i<p.length;i++){energy+=p[i];weighted+=p[i]*i*48000/8192;}return weighted/energy;};
 const early=centroid(.03),late=centroid(1.05);add('musical/brightness-fall',{early,late},{darker:late<early*.5,headroom:signalStats(moving).peak<1});
 // Beat/Chunk and repeated Song clips resolve automation from the Beat clock.
 const beat=create();beat.bars=2;const inst=beat.instruments[0];inst.sounds[0].patch=patch;inst.automation={...lane,points:[{id:'begin',step:0,value:8000},{id:'end',step:32,value:300}]};inst.timeline=[inst.chunks[0].id,inst.chunks[0].id];inst.placements=[null,null];inst.chunks[0].notes=[{id:'a',pitch:60,start:0,duration:16,velocity:.8}];upgradeBeatFeatures(beat);
 const events=renderEvents(beat);add('timeline/chunk-boundary',{steps:events.map(e=>e.timeline.step)},{absoluteBeatClock:events[0].timeline.step===0&&events[1].timeline.step===16});
 const song=createSong(beat);song.tracks[0].clips[0].lengthSteps=64;const songEvents=renderEvents(song);add('timeline/song-repeat',{steps:songEvents.map(e=>e.timeline.step)},{resetsPerBeat:songEvents.map(e=>e.timeline.step).join(',')==='0,16,0,16'});
 // Actual transport, including seek and loop, must schedule the expected current state.
 for(const seek of [0,16]){
  const captured=[],old=AudioContext.prototype.createBiquadFilter;AudioContext.prototype.createBiquadFilter=function(){const filter=old.call(this),set=filter.frequency.setValueAtTime.bind(filter.frequency);filter.frequency.setValueAtTime=(value,time)=>{captured.push(value);return set(value,time);};return filter;};let transport;
  try{transport=await play(beat,{startStep:seek});await new Promise(done=>setTimeout(done,100));}finally{transport?.stop();AudioContext.prototype.createBiquadFilter=old;}
  const wanted=8000*(300/8000)**(seek/32);add('transport/seek/'+seek,{captured,wanted},{state:captured.some(value=>Math.abs(value-wanted)<1e-8)});
 }
 const tiny=clone(beat);tiny.bars=1;tiny.bpm=240;tiny.instruments[0].timeline.length=1;tiny.instruments[0].placements.length=1;tiny.instruments[0].automation=lane;tiny.instruments[0].chunks[0].notes[0].duration=1;
 {const captured=[],old=AudioContext.prototype.createBiquadFilter;AudioContext.prototype.createBiquadFilter=function(){const f=old.call(this),set=f.frequency.setValueAtTime.bind(f.frequency);f.frequency.setValueAtTime=(v,t)=>{captured.push(v);return set(v,t);};return f;};let transport;try{transport=await play(tiny,{loop:true});await new Promise(done=>setTimeout(done,1300));}finally{transport?.stop();AudioContext.prototype.createBiquadFilter=old;}add('transport/loop',{captured},{reset:captured.filter(v=>Math.abs(v-8000)<1e-8).length>=2});}
 // Export uses the same events and plans, including tails and the existing master gain.
 const bytes=await (await wav(beat)).arrayBuffer(),view=new DataView(bytes),frames=(bytes.byteLength-44)/4,context=new OfflineAudioContext(2,frames,44100),out=context.createGain();out.gain.value=.85;out.connect(context.destination);
 for(const event of renderEvents(beat))scheduleNote(context,out,event.instrument,event.note,event.at,event.duration,event.beat,null,event.timeline);const expected=await context.startRendering();let maxLsb=0,energy=0;for(let i=0;i<frames;i++)for(let ch=0;ch<2;ch++){const x=Math.max(-1,Math.min(1,expected.getChannelData(ch)[i])),value=x<0?x*32768:x*32767,actual=view.getInt16(44+(i*2+ch)*2,true);maxLsb=Math.max(maxLsb,Math.abs(actual-value));energy+=actual*actual;}
 add('export/wav',{frames,maxLsb,energy,seconds:frames/44100},{canonicalParity:maxLsb<=1,completeTail:frames/44100>4.05,audible:energy>1000});
 report={schemaVersion:1,backend:'canonical-cutoff-automation',environment:{userAgent:navigator.userAgent},policy:{maxPcm:.0001,rmsPcm:.00002,precedence:'Patch base -> Beat-clock automation -> per-note modulation -> bounded filter frequency',scope:'Filter cutoff on piano-roll synths. Existing onset-based seeking is retained; voices sounding before seek are not reconstructed. End-of-cycle/clip release tails hold the terminal value. No hardware qualification.'},summary:{cases:results.length,failed:failures.length,status:failures.length?'fail':'pass'},results,failures};
}catch(error){report={error:String(error.stack||error)};}await fetch('/__audio_benchmark',{method:'POST',body:JSON.stringify(report)});
</script>
