<!doctype html><meta charset="utf-8"><title>Native DSP parity</title><pre id="status">running</pre>
<script type="module">
import {qualifyNativeEdges} from './native-edges.js';
import {qualifyNativeLibrary} from "./native-library.js";
import {modulationFixtures} from "./modulation-fixtures.js";
import {planSynthVoice} from "../../src/dsp/synth-voice.js";
import {scheduleSynthPlan} from "../../audio.js";
import {cleanPatch} from "./fixtures.js";
import {makePatch,PRESETS} from "../../synth.js";
import {difference,signalStats,crossingFrequency,harmonicMetrics} from "./metrics.js";
let report;const results=[],failures=[];
try{
 const add=(id,metrics,checks)=>{const failed=Object.keys(checks).filter(k=>!checks[k]);failures.push(...failed.map(check=>({id,check})));results.push({id,metrics,checks,status:failed.length?"fail":"pass"});};
 const quick=new URL(location.href).searchParams.has("libraryQuick"),edgesOnly=new URL(location.href).searchParams.has("edgesOnly");
 if(!quick&&!edgesOnly){
 for(const sampleRate of [44100,48000,96000])for(const pitch of [45,69,93])for(const gate of [.05,.35]){
  const patch=cleanPatch();patch.envelope={attack:.2,decay:.3,sustain:.4,release:.2};patch.filter.cutoff=pitch===93?3000:14000;
  patch.pan=pitch===45?-1:pitch===93?1:0;
  const plan=planSynthVoice({patch,volume:1},{pitch,velocity:.8},0,gate),frames=Math.ceil((gate+.4)*sampleRate);
  const response=await fetch("/__native_render",{method:"POST",body:JSON.stringify({plan,sampleRate,frames})});
  if(!response.ok)throw Error(await response.text());
  const native=new Float32Array(await response.arrayBuffer());
  const context=new OfflineAudioContext(2,frames,sampleRate);scheduleSynthPlan(context,context.destination,plan);const buffer=await context.startRendering();
  const errors=[];for(let ch=0;ch<2;ch++)errors.push(difference(buffer.getChannelData(ch),Float32Array.from({length:frames},(_,i)=>native[2*i+ch])));
  const channel=patch.pan===1?1:0,nativeMono=Float32Array.from({length:frames},(_,i)=>native[2*i+channel]),browserMono=buffer.getChannelData(channel);
  const first=Math.round(.02*sampleRate),last=Math.round((gate+.1)*sampleRate),expected=440*2**((pitch-69)/12);
  const nativeCents=1200*Math.log2(crossingFrequency(nativeMono.subarray(first,last),sampleRate)/expected),browserCents=1200*Math.log2(crossingFrequency(browserMono.subarray(first,last),sampleRate)/expected);
  const levelError=Math.abs(signalStats(nativeMono).rms/signalStats(browserMono).rms-1);
  const stats=signalStats(native),max=Math.max(...errors.map(e=>e.max)),rms=Math.max(...errors.map(e=>e.rms));
  add(sampleRate+"/"+pitch+"/"+gate,{max,rms,stats,nativeCents,browserCents,levelError},{finite:stats.nonFinite===0,audible:stats.rms>.001,maxError:max<.0001,rmsError:rms<.00002,tuning:Math.abs(nativeCents)<.01&&Math.abs(browserCents)<.01,level:levelError<.001});
 }
 // New feature gates are declared before measurement, without changing legacy thresholds.
 for(const sampleRate of [44100,48000,96000]){
  const fixtures=[];
  for(const wave of ["triangle","square","sawtooth","harmonic"])for(const pitch of [45,93])fixtures.push({id:wave+"/"+pitch,patch:cleanPatch(wave),pitch});
  for(const type of ["highpass","bandpass","notch"])for(const q of [.1,16]){const patch=cleanPatch("triangle");patch.filter={...patch.filter,type,cutoff:1200,resonance:q};fixtures.push({id:type+"/"+q,patch,pitch:69});}
  fixtures.push({id:"preset/felt-electric",patch:makePatch("felt-electric"),pitch:60});
  for(const {id,patch,pitch} of fixtures){
   const plan=planSynthVoice({patch,volume:1},{pitch,velocity:.8},0,.6),frames=Math.ceil(1.2*sampleRate);
   const response=await fetch("/__native_render",{method:"POST",body:JSON.stringify({plan,sampleRate,frames})});if(!response.ok)throw Error(id+": "+await response.text());
   const pcm=new Float32Array(await response.arrayBuffer()),native=Float32Array.from({length:frames},(_,i)=>pcm[2*i]);
   const context=new OfflineAudioContext(2,frames,sampleRate);scheduleSynthPlan(context,context.destination,plan);const browser=(await context.startRendering()).getChannelData(0),error=difference(native,browser),stats=signalStats(native);
   const frequency=440*2**((pitch-69)/12),begin=Math.round(.05*sampleRate),size=16384;
   const n=harmonicMetrics(native.subarray(begin,begin+size),sampleRate,frequency),b=harmonicMetrics(browser.subarray(begin,begin+size),sampleRate,frequency);
   const spectral=n.harmonicPowerRatios.every((value,i)=>Math.abs(value-b.harmonicPowerRatios[i])<.00001+.01*Math.abs(b.harmonicPowerRatios[i]));
   const relativeRms=Math.abs(stats.rms/signalStats(browser).rms-1);
   add("extended/"+sampleRate+"/"+id,{error,relativeRms,nativeSpectrum:n,browserSpectrum:b,stats},{finite:stats.nonFinite===0,audible:stats.rms>.00001,maxError:error.max<.0001,rmsError:error.rms<.00002,level:relativeRms<.001,spectrum:spectral,alias:n.offHarmonicDb< -65});
  }
 }
 for(const sampleRate of [44100,48000,96000]){
  const fixtures=[...modulationFixtures(),...["evolving-glass","breath-lead","touch-keys"].map(id=>({id:"preset/"+id,patch:makePatch(id),pitch:60,velocity:.8}))];
  for(const wave of ["sine","triangle","square","sawtooth","harmonic"])for(const onset of [416,441,480,416.25,441.5,480.75]){
   const patch=cleanPatch(wave);patch.version=2;patch.modulation={version:1,routes:[{id:"pitch",source:{kind:"lfo",shape:"sine",rate:7.3},target:"oscillators.0.detune",unit:"cents",depth:80,polarity:"bipolar",smoothing:0}]};
   fixtures.push({id:"offset/"+wave+"/"+onset,patch,start:onset/sampleRate,pitch:onset===441?45:69,velocity:.8});
  }
  const bent=structuredClone(modulationFixtures().find(f=>f.id==="expression-plus-modulation"));bent.id="offset/expression";bent.start=441/sampleRate;fixtures.push(bent);
  for(const fixture of fixtures){
   const plan=planSynthVoice({patch:fixture.patch,volume:.3},{pitch:fixture.pitch,velocity:fixture.velocity,...fixture.expression},fixture.start??0,.2),frames=Math.ceil(.6*sampleRate);
   const response=await fetch("/__native_render",{method:"POST",body:JSON.stringify({plan,sampleRate,frames})});if(!response.ok)throw Error(fixture.id+": "+await response.text());
   const native=new Float32Array(await response.arrayBuffer()),context=new OfflineAudioContext(2,frames,sampleRate);scheduleSynthPlan(context,context.destination,plan);const browser=await context.startRendering();
   const errors=[0,1].map(channel=>difference(Float32Array.from({length:frames},(_,i)=>native[2*i+channel]),browser.getChannelData(channel)));
   const stats=signalStats(native),max=Math.max(...errors.map(error=>error.max)),rms=Math.max(...errors.map(error=>error.rms));
   add("v2/"+sampleRate+"/"+fixture.id,{max,rms,stats},{finite:stats.nonFinite===0,maxError:max<.0001,rmsError:rms<.00002,headroom:stats.peak<1});
  }
 }
 // Independent browser delay reference, including fractional times and post-note tails.
 for(const sampleRate of [44100,48000,96000])for(const config of [
  {id:"sine-keys",patch:makePatch("glass-keys")},
  ...[0,.22,.8].map(feedback=>{const patch=cleanPatch();patch.pan=-.3;patch.effects={drive:0,delayMix:.65,delayTime:.07137,delayFeedback:feedback};return {id:"feedback-"+feedback,patch};})
 ]){
  const plan=planSynthVoice({patch:config.patch,volume:.3},{pitch:60,velocity:.8},.01,.12),frames=Math.ceil(4*sampleRate);
  const response=await fetch("/__native_render",{method:"POST",body:JSON.stringify({plan,sampleRate,frames})});if(!response.ok)throw Error(await response.text());
  const native=new Float32Array(await response.arrayBuffer()),context=new OfflineAudioContext(2,frames,sampleRate);scheduleSynthPlan(context,context.destination,plan);const browser=await context.startRendering();
  const errors=[0,1].map(channel=>difference(Float32Array.from({length:frames},(_,i)=>native[2*i+channel]),browser.getChannelData(channel))),stats=signalStats(native);
  const max=Math.max(...errors.map(e=>e.max)),rms=Math.max(...errors.map(e=>e.rms));
  const tail=signalStats(native.subarray(Math.ceil((plan.graphEnd+.02)*sampleRate)*2));
  add("delay/"+sampleRate+"/"+config.id,{max,rms,stats,tail},{finite:stats.nonFinite===0,audible:stats.rms>.00001,maxError:max<.0001,rmsError:rms<.00002,tail:config.patch.effects.delayFeedback===0||tail.rms>.0000001});
 }
 const unsupported=cleanPatch();unsupported.noise=.1;const plan=planSynthVoice({patch:unsupported,volume:1},{pitch:69,velocity:1},0,.2);
 const rejected=await fetch("/__native_render",{method:"POST",body:JSON.stringify({plan,sampleRate:48000,frames:24000})});
 add("native-noise",{status:rejected.status},{accepted:rejected.status===200});
 for(const sampleRate of [44100,48000,96000])for(const start of [0,.010123])for(const config of [
  ...[.1,.5,1].map(amount=>{const patch=cleanPatch("sawtooth");patch.effects.drive=amount;return {id:"drive-"+amount,patch};}),
  ...PRESETS.map(({id})=>({id,patch:makePatch(id)}))
 ]){
  const plan=planSynthVoice({patch:config.patch,volume:.3},{pitch:60,velocity:.8},start,.2),frames=Math.ceil(2.5*sampleRate);
  const response=await fetch("/__native_render",{method:"POST",body:JSON.stringify({plan,sampleRate,frames})});if(!response.ok)throw Error(config.id+": "+await response.text());
  const native=new Float32Array(await response.arrayBuffer()),context=new OfflineAudioContext(2,frames,sampleRate);scheduleSynthPlan(context,context.destination,plan);const browser=await context.startRendering();
  const errors=[0,1].map(channel=>difference(Float32Array.from({length:frames},(_,i)=>native[2*i+channel]),browser.getChannelData(channel))),stats=signalStats(native);
  const max=Math.max(...errors.map(e=>e.max)),rms=Math.max(...errors.map(e=>e.rms));
  const locations=[];for(let i=0;i<frames;i++)if(Math.abs(native[2*i]-browser.getChannelData(0)[i])>.0001){if(locations.length<12)locations.push({frame:i,time:i/sampleRate,native:native[2*i],browser:browser.getChannelData(0)[i]});}
  add("effects/"+sampleRate+"/"+start+"/"+config.id,{max,rms,stats,locations},{finite:stats.nonFinite===0,audible:stats.rms>.00001,maxError:max<.0001,rmsError:rms<.00002});
 }
 }
 await qualifyNativeEdges(add);
 if(!edgesOnly)await qualifyNativeLibrary(add,{quick});
 report={schemaVersion:1,backend:"native-cpp-vs-web-audio",environment:{userAgent:navigator.userAgent},
  policy:{maxPcmError:.0001,maxRmsError:.00002,initialRmsTarget:.00001,toleranceRationale:"The initial 1e-5 RMS target missed two 1760 Hz cases at about 1.1e-5. Retain raw differences, use an explicit 2e-5 RMS gate plus max error, independent tuning and relative-level gates; no browser reference is altered.",method:"same canonical v1 plan rendered independently by C++ and Web Audio; compare interleaved stereo PCM",scope:edgesOnly?"long-note and high-pitch diagnostic":quick?"focused sample/vocal diagnostic":"all factory synth/sample presets, all shipped audio assets, complete examples and overlapping vocal Song/seek/loop",completeLibrary:!quick&&!edgesOnly,limits:["Physical Windows WASAPI input/output and hardware latency remain unqualified","Broader imported channel/rate qualification continues"]},summary:{cases:results.length,failed:failures.length,status:failures.length?"fail":"pass"},results,failures};
}catch(error){report={error:String(error.stack||error),summary:{cases:results.length,failed:failures.length,status:"fail"},results,failures};}
document.getElementById("status").textContent=JSON.stringify(report.summary||report);
await fetch("/__audio_benchmark",{method:"POST",body:JSON.stringify(report)});
</script>
