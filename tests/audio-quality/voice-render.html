<!doctype html><meta charset="utf-8"><title>Voice lifecycle qualification</title><pre id="status">running</pre>
<script type="module">
import {runVoiceBenchmark} from "./voice-suite.js";
let report;
try{report=await runVoiceBenchmark();}catch(error){report={error:String(error.stack||error)};}
document.getElementById("status").textContent=JSON.stringify(report.summary||report);
await fetch("/__audio_benchmark",{method:"POST",body:JSON.stringify(report)});
</script>
