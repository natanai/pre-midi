<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{width:100%;height:100vh;border:0}</style><iframe src="about:blank"></iframe><pre id="result" hidden></pre>
<script type="module">
import {parse} from '../schema.js';import {parseSong} from '../songIO.js';
const frame=document.querySelector('iframe'),checks={},wait=async(fn,label)=>{for(let i=0;i<240;i++){if(fn())return;await new Promise(done=>setTimeout(done,25));}throw Error('Timed out: '+label);},check=(label,value)=>{checks[label]=!!value;if(!value)throw Error(label);};
frame.addEventListener('load',async()=>{
 const d=frame.contentDocument,w=frame.contentWindow,get=id=>d.getElementById(id);let blob,status='FAIL',ramps=0;
 const exported=async()=>{blob=null;get('export').click();get('export-confirm').click();await wait(()=>!!blob,'download');return JSON.parse(await blob.text());};
 const upload=async(doc,name)=>{const transfer=new w.DataTransfer();transfer.items.add(new w.File([JSON.stringify(doc)],name,{type:'application/json'}));get('file').files=transfer.files;get('file').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>get('status').textContent==='Opened '+name,'import');};
 try{
  w.confirm=()=>true;get('new').click();const create=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=value=>{if(value.type==='application/json')blob=value;return create(value);};w.HTMLAnchorElement.prototype.click=function(){};
  if(get('sound-toggle').getAttribute('aria-expanded')!=='true')get('sound-toggle').click();
  const panel=()=>d.querySelector('.parameter-automation'),lane=()=>panel().querySelector('.automation-lane'),value=()=>lane().querySelector('[aria-label="end value"]');
  const add=target=>{panel().querySelector('[aria-label="automation target"]').value=target;[...panel().querySelectorAll('button')].find(button=>button.textContent==='+ automation').click();};
  add('pan');add('amplitude');check('independent parameter lanes',panel().querySelectorAll('.automation-lane').length===2);
  value().value='.7';value().dispatchEvent(new w.Event('change',{bubbles:true}));check('precise parameter edit',Number(value().value)===.7);
  get('undo').click();check('undo restores previous curve',Number(value().value)===0);get('redo').click();check('redo restores edit',Number(value().value)===.7);
  const graph=lane().querySelectorAll('.visual-graph-point');check('two-axis endpoints',graph.length===2&&[...graph].every(point=>point.getAttribute('aria-description')?.includes('up/down')));
  graph[0].dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));check('interactive musical position',Number(lane().querySelector('[aria-label="begin step"]').value)===1);
  const beat=await exported(),lanes=beat.instruments[0].sounds[0].patch.automation;check('current Beat lane-array round trip',Array.isArray(lanes)&&JSON.stringify(parse(JSON.stringify(beat)))===JSON.stringify(beat));
  d.querySelector('#piano .note[aria-label^="C4, step 1,"]')?.click();
  const original=w.AudioContext.prototype.createStereoPanner;w.AudioContext.prototype.createStereoPanner=function(){const node=original.call(this),ramp=node.pan.linearRampToValueAtTime.bind(node.pan);node.pan.linearRampToValueAtTime=(...args)=>{ramps++;return ramp(...args);};return node;};get('play').click();await wait(()=>ramps>0,'automated playback');get('play').click();check('live playback schedules parameter ramps',ramps>0);
  [...lane().querySelectorAll('button')].find(button=>button.textContent==='remove lane').click();check('lane removal',panel().querySelectorAll('.automation-lane').length===1);get('undo').click();check('lane removal undo',panel().querySelectorAll('.automation-lane').length===2);
  get('new').click();await upload(beat,'automation.premidi');check('import retains exact lanes',JSON.stringify((await exported()).instruments[0].sounds[0].patch.automation)===JSON.stringify(lanes));
  get('song-expand').click();const song=await exported();check('Song lane round trip',JSON.stringify(parseSong(JSON.stringify(song)))===JSON.stringify(song));
  check('workspace fits viewport',d.documentElement.scrollWidth<=frame.clientWidth+3);status='PASS';
 }catch(error){checks.error=String(error.stack||error);}
 document.getElementById('result').textContent=JSON.stringify(checks);await fetch('/__automation_result?status='+status+'&details='+encodeURIComponent(JSON.stringify(checks)));
},{once:true});frame.src='../index.html';
</script>
