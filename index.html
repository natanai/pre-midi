<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>pre-midi — Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
<header>
 <div class="brand"><b>pre-midi</b><small>PRE-PROGRAMMED / MUSIC STUDIO</small></div>
 <nav aria-label="Files">
  <button id="new" type="button">New</button>
  <button id="import" type="button">Open .premidi</button>
  <button id="export" type="button" class="primary">Save .premidi</button>
  <button id="wav" type="button">Export WAV</button>
  <input id="file" type="file" accept=".premidi,application/json" hidden>
 </nav>
</header>
<main>
 <section class="song">
  <label>COMPOSITION <input id="title" maxlength="100" aria-label="Composition title"></label>
  <div class="transport">
   <button id="stop" type="button" aria-label="Stop playback">■</button>
   <button id="play" type="button" class="primary">▶ Play</button>
   <label>BPM <input id="bpm" type="number" min="40" max="240"></label>
   <label>BARS <select id="bars"><option>2</option><option>4</option><option>8</option><option>16</option></select></label>
   <label><input id="loop" type="checkbox" checked> Loop</label>
   <output id="position" aria-label="Playback position">1.1</output>
  </div>
 </section>
 <div class="work">
  <aside class="instrument-pane" aria-label="Instruments">
   <div class="heading"><h2>Instruments</h2></div>
   <button id="add-instrument" class="add-instrument-action" type="button">+ Add instrument</button>
   <div id="instrument-list" aria-label="Instruments"></div>
  </aside>
  <div class="mainwork">
   <section class="timeline-section" aria-label="Composition timeline">
    <div class="heading"><h2>Timeline</h2><span class="timeline-tick-label">BARS</span></div>
    <div class="scroll"><div id="arrangement"></div></div>
   </section>
   <section class="notes-section" aria-label="Chunk note editor">
    <div class="heading notes-heading">
     <div class="chunk-heading"><h2>Notes</h2><span id="editing-identity" class="editing-identity"></span></div>
     <div class="history-actions"><button id="undo" type="button">Undo</button><button id="redo" type="button">Redo</button></div>
    </div>
    <div class="notes-toolbar">
     <div class="chunk-fields">
      <label>Chunk <select id="chunk" aria-label="Choose chunk to edit"></select></label>
      <label>Name <input id="chunk-name" aria-label="Chunk name" maxlength="60"></label>
     </div>
     <div class="chunk-actions" aria-label="Chunk actions">
      <button id="add-chunk" type="button">+ New</button>
      <button id="duplicate-chunk" type="button">Duplicate</button>
      <button id="delete-chunk" type="button">Delete</button>
     </div>
     <label class="note-length-control">New notes <select id="length" aria-label="Initial note length"><option value="1">1/16</option><option value="2">1/8</option><option value="4">1/4</option><option value="8">1/2</option><option value="16">1 bar</option></select></label>
    </div>
    <div class="piano-scroll"><div id="piano"></div></div>
   </section>
   <section class="sound-section" aria-label="Instrument sound">
    <div class="heading sound-section-heading">
     <div class="sound-heading"><h2>Sound</h2><span id="edit-instrument-note" class="editing-identity"></span></div>
     <div class="sound-actions"><button id="change-sound" type="button">Browse sounds</button><button id="save-sound" type="button">Save preset</button></div>
    </div>
    <div class="patch-info"><span id="patch-label"></span><span class="scope-description">Applies to all this instrument's chunks</span></div>
    <div class="controls">
     <div class="sound-control-group sound-identity-controls">
      <label>Name <input id="instrument-name" maxlength="60"></label>
      <label>Volume <input id="volume" type="range" min="0" max="100"><output id="volume-value"></output></label>
     </div>
     <button id="remove-instrument" type="button" class="danger">Remove instrument</button>
    </div>
    <div id="synth-editor" class="synth-editor" aria-label="Synthesizer controls"></div>
   </section>
  </div>
 </div>
</main>
<footer><span id="status" role="status">Saved locally</span><span>.premidi v3 · GAME PARITY PENDING · <a href="https://github.com/natanai/pre-midi">SOURCE</a></span></footer>
</div>
<dialog id="instrument-dialog" class="instrument-dialog" aria-labelledby="instrument-dialog-title">
 <div class="library-top"><div><h2 id="instrument-dialog-title">Instrument library</h2><p id="library-description">Original synthesizer sounds. Every parameter can be changed.</p></div>
  <button id="close-library" type="button" aria-label="Close instrument library">×</button></div>
 <div class="library-filters" id="library-filters" aria-label="Sound categories"></div>
 <div id="library-sounds" class="library-sounds" aria-label="Available sounds"></div>
</dialog>
<script type="module" src="./studio.js"></script>
</body>
</html>
