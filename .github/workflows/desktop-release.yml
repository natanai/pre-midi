name: Windows portable release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish a prerelease from this exact commit
        type: boolean
        default: false
      publish_stable:
        description: Explicitly qualify and publish a signed stable Windows portable release
        type: boolean
        default: false
      qualify_audio:
        description: Run the optional full browser and native audio suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
      qualify: ${{ steps.resolve.outputs.qualify }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(version)) throw Error('Invalid package version');
            const tag = 'v' + version;
            const preview = version.includes('-');
            const tagged = context.ref.startsWith('refs/tags/');
            if (tagged && context.ref !== 'refs/tags/' + tag) throw Error('Tag/package version mismatch');
            const inputs = context.payload.inputs || {};
            let versionChanged = false;
            if (context.eventName === 'push' && !tagged) {
              try {
                const previous = await github.rest.repos.getContent({...context.repo,path:'package.json',ref:context.payload.before});
                const oldVersion = JSON.parse(Buffer.from(previous.data.content,'base64').toString('utf8')).version;
                versionChanged = oldVersion !== version;
              } catch(error) {
                if(error.status !== 404) throw error;
                versionChanged = true;
              }
            }
            const versionPreview = context.eventName === 'push' && !tagged && preview && versionChanged;
            const requested = tagged || versionPreview || inputs.publish_preview === 'true' || inputs.publish_stable === 'true';
            if (requested && !preview && inputs.publish_stable !== 'true') {
              throw Error('Stable publication requires an explicit qualified workflow_dispatch publish_stable=true');
            }
            if (requested && preview && inputs.publish_stable === 'true') throw Error('Stable publication requires a stable version');
            const commit = require('child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            const publish = requested;
            if (publish) try {
              const ref = await github.rest.git.getRef({...context.repo,ref:'tags/'+tag});
              if(ref.data.object.sha !== commit) {
                throw Error('Version tag already points to another commit; bump package.json');
              }
            } catch(error) {
              if(error.status !== 404) throw error;
            }
            core.setOutput('commit',commit);
            core.setOutput('tag',tag);
            core.setOutput('publish',String(publish));
            core.setOutput('build',String(requested || context.eventName === 'workflow_dispatch'));
            core.setOutput('qualify',String(inputs.qualify_audio === 'true' || inputs.publish_stable === 'true'));
  build:
    needs: source
    if: needs.source.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      PREMIDI_NATIVE_TEST_BACKEND: 'null'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: dtolnay/rust-toolchain@1.99.1
        timeout-minutes: 3
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          cache-on-failure: true
      - run: npm ci
      - run: npm run check
      - run: node scripts/fetch-miniaudio.mjs
      - run: node scripts/desktop-config.mjs ${{ matrix.target }} --windows-portable-only
      - name: Build exact desktop source
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }} --no-bundle --config ci-config.json -- --locked
      - name: Rust update policy tests
        working-directory: desktop
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Verify Windows portable runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw 'Could not inspect Windows runtime dependencies' }
          $imports = & $dumpbin.FullName /DEPENDENTS desktop/target/${{ matrix.target }}/release/pre-midi.exe
          $imports
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency inspection failed' }
          if ($imports -match '(?i)(MSVCP|VCRUNTIME|CONCRT)[0-9_]*\.dll') { throw 'Portable executable requires an external Visual C++ runtime' }
      - name: Collect required artifacts and checksums
        run: python scripts/package-desktop.py ${{ matrix.target }} --windows-portable-only
      - name: Windows portable upgrade, isolation, relocation, copy and failure recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release/
          if-no-files-found: error
      - name: Print qualification evidence
        if: always()
        run: python -c "from pathlib import Path; import os; [print(p.read_text()) for p in Path(os.environ['RUNNER_TEMP']).glob('premidi*smoke.json')]"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/premidi*smoke.json
            desktop/Cargo.lock
          if-no-files-found: error
  audio-qualification:
    name: Exact-commit source, browser and native audio verification
    needs: source
    if: needs.source.outputs.qualify == 'true'
    uses: ./.github/workflows/qualify.yml
    permissions:
      contents: read
  publish:
    needs: [source, build, audio-qualification]
    if: always() && needs.source.outputs.publish == 'true' && needs.build.result == 'success' && (needs.source.outputs.qualify != 'true' || needs.audio-qualification.result == 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Verify Windows portable release (signed or manual-only)
        env:
          ALLOW_STABLE_RELEASE: ${{ inputs.publish_stable }}
        run: node scripts/publish-desktop.mjs release --windows-portable-only
      - name: Create immutable tag only after build and artifact verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        shell: bash
        run: |
          tag_record="$RUNNER_TEMP/immutable-tag.json"
          tag_error="$RUNNER_TEMP/immutable-tag-error.txt"
          # Only a verified 404 permits creation. Do not turn an API/network
          # failure or malformed response into a purported missing tag.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >"$tag_record" 2>"$tag_error"; then
            existing="$(jq -er '.object.sha | select(type == "string" and length == 40)' "$tag_record")" ||
              { echo 'Tag API returned no valid SHA; refusing to overwrite'; exit 1; }
            if [ "$existing" != "$SOURCE_COMMIT" ]; then
              echo "Release tag collision: ${RELEASE_TAG} points to ${existing:0:12}; expected ${SOURCE_COMMIT:0:12}"
              exit 1
            fi
          else
            if ! grep -q 'HTTP 404' "$tag_error"; then
              cat "$tag_error"
              echo 'Tag lookup failed without a confirmed 404; refusing to publish'
              exit 1
            fi
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${RELEASE_TAG}" -f "sha=${SOURCE_COMMIT}"
          fi
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt"; then
            test "$(cat "$RUNNER_TEMP/release-draft.txt")" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            args=(--draft --title "pre-midi ${RELEASE_TAG#v} Windows portable")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}" --notes-file release/release-notes.md
          fi
          for file in release/*; do
            case "$file" in *artifacts-*.json|*release-notes.md) continue;; esac
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          gh release edit "$RELEASE_TAG" --draft=false
