name: Verify pre-midi
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Fetch pinned CC0 recordings
        run: node scripts/fetch-samples.mjs
      - name: Stage minimal Pages build
        run: node scripts/prepare-pages.mjs
      - name: Measure actual offline audio against versioned reference fixtures
        run: npm run benchmark:audio
      - name: Upload audio qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-quality
          path: benchmarks/audio-quality.latest.json
          if-no-files-found: error
      - name: Check shipped desktop and mobile studio in Chrome
        run: PREMIDI_APP_ROOT=dist node tests/layout.browser.mjs
