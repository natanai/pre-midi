name: Check prototype
on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'benchmarks/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check

  native-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned native audio device host
        run: node scripts/fetch-miniaudio.mjs
      - name: Exercise native Song emergency Stop and page cleanup
        run: node scripts/native-stream-device-check.mjs
      - name: Compile Rust/native control and run ownership tests
        run: cargo test --manifest-path native/control-tests/Cargo.toml --locked
