name: Verify pre-midi
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Prepare versioned browser assets
        run: node scripts/prepare-pages.mjs
      - name: Fetch pinned CC0 recordings
        run: node scripts/fetch-samples.mjs
      - name: Check actual desktop and mobile layout in Chrome
        run: node tests/layout.browser.mjs
