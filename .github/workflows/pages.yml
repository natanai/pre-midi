name: Deploy pre-midi to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['*.js', '*.css', '*.html', '*.svg', 'package.json', 'src/**', 'phone/**', 'desktop/icons/**', 'THIRD_PARTY_NOTICES.md', 'scripts/prepare-pages.mjs', 'scripts/fetch-samples.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned CC0 recordings
        run: node scripts/fetch-samples.mjs
      - name: Prepare versioned browser assets
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
