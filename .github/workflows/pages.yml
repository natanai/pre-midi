name: Deploy pre-midi to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Check static app
        run: |
          node --check studio.js
          node --check audio.js
          node --check schema.js
          npm test
      - name: Fetch pinned CC0 recordings
        run: node scripts/fetch-samples.mjs
      - name: Prepare versioned browser assets
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
